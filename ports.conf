# どの port を、どの道具で動かすか。
#
# https://www.netbsd.org/ports/ に並んでいるもののうち、Ubuntu の上で
# 動かせるものだけを書いてある。動かせるかどうかは二つの条件の掛け算で、
# 片方でも欠けると入れられない。
#
#   1. その機械を真似られる emulator が Ubuntu にあること
#   2. anita がその port の入れ方を知っていること (anita.py の arch_props)
#
# 2 は今のところ anita 2.18 の一覧そのままで、i386 amd64 sparc sparc64
# alpha hppa macppc evbarm riscv (QEMU)、pmax hpcmips landisk (gxemul)、
# vax (simh) の 14 種。mac68k (q800) や virt68k、evbmips (malta)、prep (40p)
# のように QEMU に機械はあるが anita が知らないものは、入れる手順を別に
# 書き起こすまで入らない。
#
# 列:
#   port    こちらで使う名前。release ツリーの名前に合わせてある
#   arch    anita に渡す名前。release ツリーの名前とは違うことがある
#   vmm     anita に渡す emulator の種類
#   emu     実行ファイルの名前
#   mem     ゲストのメモリ (MB)。古い port は積みすぎると起動しない
#   pkg     Ubuntu で入れる package
#   tree    配布物の在り処。release ツリーか、daily か
#
# tree=daily の三つは、sysinst を通さず展開済みイメージから起こす port
# (anita.py の image_name)。そのイメージは release には無く daily にしか
# 置かれていないので、版の代わりに netbsd-10 のようなブランチ名で組む。
# 古い release ツリーにも evbarm/ はあるが、中身は当時の別物なので
# ここでは拾わない。
#
# port          arch                vmm     emu                   mem   pkg                tree
i386            i386                qemu    qemu-system-i386      1024  qemu-system-x86    release
amd64           amd64               qemu    qemu-system-x86_64    1024  qemu-system-x86    release
sparc           sparc               qemu    qemu-system-sparc     256   qemu-system-sparc  release
sparc64         sparc64             qemu    qemu-system-sparc64   512   qemu-system-sparc  release
alpha           alpha               qemu    qemu-system-alpha     512   qemu-system-misc   release
hppa            hppa                qemu    qemu-system-hppa      512   qemu-system-misc   release
macppc          macppc              qemu    qemu-system-ppc       512   qemu-system-ppc    release
evbarm          evbarm-earmv7hf     qemu    qemu-system-arm       512   qemu-system-arm    daily
evbarm64        evbarm-aarch64      qemu    qemu-system-aarch64   1024  qemu-system-arm    daily
riscv64         riscv-riscv64       qemu    qemu-system-riscv64   1024  qemu-system-misc   daily
pmax            pmax                gxemul  gxemul                128   gxemul             release
hpcmips         hpcmips             gxemul  gxemul                128   gxemul             release
landisk         landisk             gxemul  gxemul                128   gxemul             release
vax             vax                 simh    vax                   128   simh               release
