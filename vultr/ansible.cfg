[defaults]
inventory = inventory.yml
# 読みやすさのために結果を YAML で出す。stdout_callback = yaml は
# community.general のもので 12.0.0 で削除された。今は ansible-core の
# default callback の option で、ini では [defaults] の callback_result_format。
callback_result_format = yaml
# 立てるたびに別の鍵の別のホストになる。known_hosts に貯めても照合の役に
# 立たないので照合しない。中身は使い捨てで、鍵は焼いたイメージに入って
# いるものだけ通る。
host_key_checking = False

[ssh_connection]
pipelining = True
