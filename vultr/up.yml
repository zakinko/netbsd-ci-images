---
# Vultr に NetBSD を立てる。
#
# やっていることは二手だけ。公開 URL に置いた raw イメージを snapshot と
# して取り込み、その snapshot から instance を deploy する。Vultr 側が
# ディスクへイメージをそのまま書き戻すので、レスキューに落ちて dd するのと
# 同じことを API 越しに済ませている。VNC もコンソールも要らない。
#
#   export VULTR_API_KEY=...
#   ansible-playbook up.yml -e image_url=https://.../amd64-10.1-vultr.img
#
# 取り込んだ snapshot は消すまで残る。二度目からは image_url を渡さなくても
# 同じ description のものを拾って立て直すので、料金は snapshot の保管分
# ($0.05/GB/月) と instance の時間割だけになる。

- name: Vultr に NetBSD の instance を立てる
  hosts: localhost
  gather_facts: false
  module_defaults:
    vultr.cloud.firewall_group: { api_key: "{{ vultr_api_key }}" }
    vultr.cloud.firewall_rule: { api_key: "{{ vultr_api_key }}" }
    vultr.cloud.snapshot: { api_key: "{{ vultr_api_key }}" }
    vultr.cloud.snapshot_info: { api_key: "{{ vultr_api_key }}" }
    vultr.cloud.instance: { api_key: "{{ vultr_api_key }}" }
    vultr.cloud.instance_info: { api_key: "{{ vultr_api_key }}" }

  tasks:
    - name: API 鍵があるか確かめる
      ansible.builtin.assert:
        that: vultr_api_key | length > 0
        fail_msg: >-
          VULTR_API_KEY が空。export VULTR_API_KEY=... してから走らせる

    # 手元の住所は repo に入れない。追跡外の local.yml があれば読む。
    - name: 手元の設定を読む
      ansible.builtin.include_vars:
        file: local.yml
      failed_when: false

    - name: 22 番を開ける相手が決まっているか
      ansible.builtin.assert:
        that: (ssh_allow_v6 | length > 0) or (ssh_allow_v4 | length > 0)
        fail_msg: >-
          ssh_allow_v6 か ssh_allow_v4 が要る。vultr/local.yml に書くか
          -e ssh_allow_v6=... で渡すこと。無いまま立てると 22 番が
          全世界に開く

    - name: 取り込み済みの snapshot を探す
      vultr.cloud.snapshot_info:
      register: snapshots

    - name: 同じ名前のものが在るか
      ansible.builtin.set_fact:
        snapshot_exists: >-
          {{ snapshots.vultr_snapshot_info
             | selectattr('description', 'equalto', snapshot_name)
             | list | length > 0 }}

    - name: 無ければ image_url が要る
      ansible.builtin.assert:
        that: image_url | length > 0
        fail_msg: >-
          "{{ snapshot_name }}" という snapshot がまだ無い。PROFILE=vultr で焼いた
          raw イメージを公開 URL に置き、-e image_url=... で渡すこと
      when: not snapshot_exists

    # Vultr の取り込みは 302 を追わない。GitHub の release は必ず署名付きの
    # 別ホストへ飛ばすので、そのまま渡すと取りに行けず、snapshot は pending
    # になった直後に消される。API はエラーを返さないので、待っている側からは
    # 固まったようにしか見えない。
    #
    # 追う先は一段とは限らないので curl に任せる。uri モジュールは
    # follow_redirects: none のとき location を一つ返すだけで、多段を辿れない。
    # クエリ文字列が付いていても Vultr は受け取る (署名付き URL で確認済み)。
    - name: image_url のリダイレクトを解決する
      ansible.builtin.command:
        argv: [curl, -sIL, -o, /dev/null, -w, '%{url_effective}', "{{ image_url }}"]
      register: resolved
      changed_when: false
      when: not snapshot_exists

    # Vultr は raw しか受け取らない。gz や qcow2 を渡すと取り込み自体は
    # 通っても、起動しないディスクが出来上がる。mkimg.sh の vultr が
    # 固めずに置いているのはこのため。
    - name: raw イメージを snapshot として取り込む
      vultr.cloud.snapshot:
        description: "{{ snapshot_name }}"
        url: "{{ resolved.stdout }}"
        uefi: false  # mkimg.sh が作るのは MBR + disklabel の BIOS 起動
      when: not snapshot_exists

    # 上のモジュールは自分で complete まで待つ。それでも引き直すのは、
    # 前回の実行が待ちきれずに落ちていると、まだ取り込み中の snapshot を
    # 掴んだまま deploy へ進んでしまうため。
    #
    # 取りに行けなかった snapshot は Vultr が黙って消す。消えたものを待つと
    # 永遠に終わらないので、居なくなったら落ちる。実際にこれで固まった。
    - name: 取り込みが終わっているか確かめる
      vultr.cloud.snapshot_info:
      register: snapshots
      vars:
        snap: >-
          {{ snapshots.vultr_snapshot_info
             | selectattr('description', 'equalto', snapshot_name)
             | list | first | default({}) }}
      until: snap.status | default('') == 'complete'
      failed_when: snap == {}
      retries: 90
      delay: 20

    # 取り込みが済めば置き場の asset は要らない。snapshot さえ在れば
    # 立て直せる。release に置きっぱなしにすると、鍵を焼いたイメージが
    # 公開されたまま残ることにもなる。消すのはこちらの手では出来ない
    # (GitHub 側の話なので) から、命令だけ出す。
    - name: 置き場の asset を落とすよう促す
      ansible.builtin.debug:
        msg: >-
          snapshot "{{ snapshot_name }}" を取り込んだ。置き場の asset はもう
          要らないので落とすこと:
          gh release delete-asset vultr {{ image_url | basename }}
          --repo zakinko/netbsd-ci-images --yes
      when: not snapshot_exists

    # 何も付けないと 22 番が全世界に開く。鍵しか通らない設定なので入られ
    # はしないが、開いている必要も無い。
    - name: firewall group を用意する
      vultr.cloud.firewall_group:
        description: "{{ label }}"

    # ICMP は落とさない。Vultr の rule は v6 の icmp を型別に分けられず、
    # 丸ごと落とすと経路 MTU 探索まで切れて、大きな転送が黙って止まる。
    # IPv6 では ICMP は通信の一部であって余分な機能ではない。
    - name: ICMPv6 を通す
      vultr.cloud.firewall_rule:
        group: "{{ label }}"
        ip_type: v6
        protocol: icmp
        subnet: "::"
        subnet_size: 0
        notes: "IPv6 は ICMP を落とすと壊れる"

    - name: 22 番を手元からだけ開ける (IPv6)
      vultr.cloud.firewall_rule:
        group: "{{ label }}"
        ip_type: v6
        protocol: tcp
        port: "22"
        subnet: "{{ ssh_allow_v6 }}"
        subnet_size: "{{ ssh_allow_v6_size }}"
        notes: ssh
      when: ssh_allow_v6 | length > 0

    - name: 22 番を手元からだけ開ける (IPv4)
      vultr.cloud.firewall_rule:
        group: "{{ label }}"
        ip_type: v4
        protocol: tcp
        port: "22"
        subnet: "{{ ssh_allow_v4 }}"
        subnet_size: "{{ ssh_allow_v4_size }}"
        notes: ssh
      when: ssh_allow_v4 | length > 0

    - name: instance を deploy する
      vultr.cloud.instance:
        label: "{{ label }}"
        hostname: "{{ label }}"
        region: "{{ region }}"
        plan: "{{ plan }}"
        snapshot: "{{ snapshot_name }}"
        firewall_group: "{{ label }}"
        enable_ipv6: true
        state: present
      register: instance

    # 一番安い plan には IPv4 が付かない。deploy が返った時点ではまだ住所が
    # 埋まっていないことがあるので、付くまで引き直す。
    - name: IPv6 の住所が付くのを待つ
      vultr.cloud.instance_info:
      register: instances
      vars:
        vps: >-
          {{ instances.vultr_instance_info
             | selectattr('label', 'equalto', label)
             | list | first | default({}) }}
      until: >-
        vps.v6_main_ip | default('') | length > 0
        and vps.v6_main_ip != '::'
      retries: 60
      delay: 10

    - name: 繋ぎ先を控える
      ansible.builtin.set_fact:
        vps_addr: >-
          {{ (instances.vultr_instance_info
              | selectattr('label', 'equalto', label)
              | list | first).v6_main_ip }}
        instance_id: >-
          {{ (instances.vultr_instance_info
              | selectattr('label', 'equalto', label)
              | list | first).id }}

    # 逆引き。専用のモジュールは無いので API を直に叩く。点を含まない名前は
    # FQDN ではないので入れない (label のままのときが該当する)。
    #
    # 正引きが無ければ片肺のままなので、AAAA は zone の側に足すこと。
    - name: 逆引きを設定する
      ansible.builtin.uri:
        url: "https://api.vultr.com/v2/instances/{{ instance_id }}/ipv6/reverse"
        method: POST
        headers:
          Authorization: "Bearer {{ vultr_api_key }}"
        body_format: json
        body:
          ip: "{{ vps_addr }}"
          reverse: "{{ target_hostname }}"
        status_code: [200, 201, 202, 204]
      when: '"." in target_hostname'

    - name: sshd が上がるのを待つ
      ansible.builtin.wait_for:
        host: "{{ vps_addr }}"
        port: 22
        timeout: 900
        search_regex: OpenSSH

    - name: 出来たものを inventory に足す
      ansible.builtin.add_host:
        name: "{{ label }}"
        groups: netbsd
        ansible_host: "{{ vps_addr }}"
        ansible_user: root

- name: 本当に NetBSD が起きているか確かめる
  hosts: netbsd
  gather_facts: false
  tasks:
    # NetBSD の base に python は無い。facts も普通のモジュールも動かないので
    # raw で叩く。要るなら pkgin install python312 を入れてから。
    - name: uname
      ansible.builtin.raw: uname -a
      register: uname
      changed_when: false

    # イメージにはアカウントを焼いていない。焼くと、公開している release に
    # 個人の名前と鍵が入ることになるし、ホームの下に来る名前は立てるまで
    # 決まらない。名前が外から与えられる以上、ここでやるのが素直。
    - name: ホスト名を決めてアカウントを作る
      ansible.builtin.script:
        cmd: >-
          files/setup-accounts.sh {{ target_hostname }}
          {% for a in accounts %}{{ a.name }}:{{ a.uid }}:{{ 'yes' if a.wheel else 'no' }} {% endfor %}
      register: setup
      changed_when: "'を作った' in setup.stdout"

    # NetBSD に python は無いので copy も authorized_key も使えない。raw で置く。
    #
    # raw は中身をそのまま ssh に渡すので、外側は必ず相手のログインシェルに
    # なる。ここは root で入っており、焼いたイメージの root の shell は
    # /bin/sh なので sh の構文がそのまま通る。**繋ぐ口座を zakinko や
    # fukachan に変えるとここは壊れる。** 作る口座の shell は /bin/csh で、
    # for も $var も csh に食われる。executable: を足しても直らない (あれは
    # 内側の話で、csh を経由する事実は変わらない)。そのときは sh -c '...' で
    # 包むか、script モジュールに移すこと。
    #
    # PATH を書くのは、ssh の非対話ログインが login shell を通らず /sbin と
    # /usr/sbin が入らないため。chown も install も mkdir 以外はそこにある。
    # script モジュール越しに走る setup-accounts.sh も同じ理由で自分で
    # PATH を設定している。
    - name: 鍵を置く
      ansible.builtin.raw: |
        set -e
        PATH=/sbin:/usr/sbin:/bin:/usr/bin; export PATH
        d=/usr/home/{{ target_hostname }}/{{ item.name }}/.ssh
        mkdir -p $d
        cat > $d/authorized_keys <<'AKEY'
        {{ lookup('url', 'https://github.com/' ~ item.github ~ '.keys', split_lines=false) | trim }}
        AKEY
        chmod 700 $d; chmod 600 $d/authorized_keys
        chown -R {{ item.name }} $d
      loop: "{{ accounts }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: 入り方
      ansible.builtin.debug:
        msg:
          - "{{ uname.stdout | trim }}"
          - "ssh root@{{ ansible_host }}"
          - "ssh zakinko@{{ ansible_host }}"
