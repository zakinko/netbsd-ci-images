---
# API 鍵は環境変数から取る。playbook にも git にも入れない。
#
#   export VULTR_API_KEY=...
#
vultr_api_key: "{{ lookup('env', 'VULTR_API_KEY') }}"

# 立てるものの名前。instance の label と hostname、snapshot の description
# を全部これで揃えてある。down.yml が消す相手もこれで引く。
label: netbsd-vultr

# 一番安い plan。$2.50/月 = $0.003/時で、一時間触って一円に届かない。
# ただし IPv4 が付かず、取れるのは ewr (ニュージャージー) と atl だけ。
# IPv4 が要るなら vc2-1c-0.5gb ($3.50/月、ewr のみ)、日本に置きたいなら
# vc2-1c-1gb ($5/月、nrt と itm) へ。plan を変えたら region も見直すこと。
plan: vc2-1c-0.5gb-v6
region: ewr

# snapshot の名前。既定は label と同じで、これまでどおり一台につき一つ
# 取り込む。同じイメージから複数台立てるときは、ここを揃えて label だけ
# 変えると、取り込みが一度で済む。
#
#   ansible-playbook up.yml -e label=emacs20 -e snapshot_name=netbsd-11.0-amd64
#   ansible-playbook up.yml -e label=emacs21 -e snapshot_name=netbsd-11.0-amd64
#
# 揃えたときは down.yml で snapshot を落とさないこと。まだ使っている instance
# の立て直しができなくなる。落とすのは全部壊したあと。
snapshot_name: "{{ label }}"

# mkimg.sh に PROFILE=vultr を渡して焼いた raw イメージの置き場。
# Vultr がここへ取りに来るので、認証もクエリも付かない公開 URL であること。
# 詳しくは README.md。
image_url: ""

# イメージに焼いた鍵に対応する秘密鍵。mkimg.sh は同じ場所に置いた
# authorized_keys を、無ければ ~/.ssh/id_rsa.pub を焼く。焼いたのがどちらか
# 分からなくなったら mkimg.sh の出力の「鍵」の行を見ること。
ansible_ssh_private_key_file: "~/.ssh/id_rsa"

# 22 番を開ける相手。ここに書かないこと。この repo は public なので、
# 手元の住所を commit すると公開される。書くのは vultr/local.yml (追跡外)
# か、走らせるときの -e。
#
#   ssh_allow_v6: "2001:db8:1234:5678::"
#   ssh_allow_v6_size: 64
#
# IPv6 の prefix は契約次第で変わる。弾かれるようになったら書き直すこと。
# 締め出されても Vultr の web console からは入れる。
ssh_allow_v6: ""
ssh_allow_v6_size: 64
ssh_allow_v4: ""
ssh_allow_v4_size: 32

# 実際のサーバ名。ホームは /usr/home/<この名前>/<user> になり、点を含む
# 名前 (FQDN) なら Vultr の逆引きにも同じ値を入れる。
#
# 逆引きだけ入れても正引きが無ければ片肺になる。snowrabbit.org の zone は
# bambi が権威なので、AAAA はそちらに足すこと。
target_hostname: "{{ label }}"

# 作るアカウント。uid と gid は bambi に合わせてある。同じ人が同じ番号で
# 居ると、tar で持ち回ったときに所有者がずれない。
#
# 鍵は GitHub から取る。repo に書かずに済み、向こうで入れ替えれば次の実行で
# 追随する。github の項に書くのは **アカウント名であって人名ではない**。
#
#   fukachan -> fmlorg     Ken'ichi Fukamachi, https://www.fml.org/
#
# 紛らわしいものが二つある。GitHub の fukachan は名前も鍵も無い別アカウント、
# fukamachi は Eitaro Fukamachi さんで別人。どちらを入れても他人に shell を
# 渡すことになる。
accounts:
  - name: zakinko
    uid: 3001
    wheel: true
    github: zakinko
  - name: fukachan
    uid: 2801
    wheel: true
    github: fmlorg

# instance に割り当てる SSH キー (Vultr に登録した名前か id)。鍵を焼いて
# いないイメージは起動時に metadata から取るので、ここが空だと誰も入れない
# 箱が立つ。焼いてある版には効かない。
#
#   ansible-playbook up.yml -e '{"ssh_keys":["zakinko-ec6dc2fb"]}'
#
ssh_keys: []
