name: mainline に送る ufs の当て物を一本だけ当てて測る

# 手で回すだけ。送る diff そのものを、その日の mainline に当てて測る。
on:
  workflow_dispatch:
    inputs:
      images_run:
        description: 'src-*bsd の artifact を持つ fs-probe の run'
        type: string
        required: true
      patch:
        description: 'fs-probe/send の diff と guest の名前'
        type: string
        default: ufs-4kn

concurrency:
  group: ufs-mainline-${{ inputs.patch }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: src-*bsd
          path: fsp/in
          merge-multiple: true
          run-id: ${{ inputs.images_run }}
          github-token: ${{ github.token }}
      - run: |
          sudo apt-get -q update
          sudo apt-get -qy install virtme-ng qemu-system-x86 flex bison bc libelf-dev libssl-dev dwarves sparse
          sudo chmod 666 /dev/kvm
          git clone -q --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git $HOME/linux
          git -C $HOME/linux log -1 --format='%H %ad'
      - name: 当てる前と後の二つを建てる
        run: |
          set -e
          cd $HOME/linux
          make -s x86_64_defconfig kvm_guest.config
          scripts/config -e BLK_DEV_LOOP -e MISC_FILESYSTEMS -e UFS_FS -e UFS_FS_WRITE -e VIRTIO_FS -e FUSE_FS -e OVERLAY_FS -e NET_9P -e NET_9P_VIRTIO -e 9P_FS -e TMPFS
          make -s olddefconfig
          grep -E 'CONFIG_UFS_FS|CONFIG_BLK_DEV_LOOP=' .config
          make -s -j$(nproc) bzImage
          cp arch/x86/boot/bzImage $HOME/bz-base
          touch fs/ufs/*.c; make W=1 C=1 fs/ufs/ > $HOME/w-base 2>&1
          patch -p1 -F0 -f -i $GITHUB_WORKSPACE/fs-probe/send/${{ inputs.patch }}.diff < /dev/null
          touch fs/ufs/*.c; make W=1 C=1 fs/ufs/ > $HOME/w-new 2>&1
          for x in base new; do grep -E 'warning:|error:' $HOME/w-$x | sed -E 's/:[0-9]+(:[0-9]+)?:/:/' | sort -u > $HOME/ws-$x || true; done
          echo "new warnings: $(comm -13 $HOME/ws-base $HOME/ws-new | wc -l)"
          comm -13 $HOME/ws-base $HOME/ws-new
          make -s -j$(nproc) bzImage
          cp arch/x86/boot/bzImage $HOME/bz-new
      - name: fsstress を建てる
        if: inputs.patch == 'ufs-change-blocknr'
        run: |
          sudo apt-get -qy install autoconf automake libtool libtool-bin uuid-dev xfslibs-dev libaio-dev libacl1-dev libattr1-dev pkg-config gettext
          for i in 1 2 3; do git clone -q --depth 1 --branch v2026.10.15 https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git $HOME/xfstests && break; sleep 60; done
          cd $HOME/xfstests && (make configure && ./configure && make -C lib && make -C ltp fsstress) > $HOME/xb.log 2>&1 || { tail -30 $HOME/xb.log; exit 1; }
          echo "FSSTRESS=$HOME/xfstests/ltp/fsstress" >> $GITHUB_ENV
      - name: 測る
        run: |
          mkdir -p out
          for x in base new; do
            D=
            case ${{ inputs.patch }} in ufs-zeroout|ufs-readahead)
              for n in netbsd-ffs2 freebsd-ufs2; do cp --sparse=always fsp/in/$n.img $HOME/$x-$n.raw; D="$D --disk $HOME/$x-$n.raw"; done ;;
            esac
            timeout 2700 vng --run $HOME/bz-$x --user root --memory 8G --cpus 4 $D --rwdir=$PWD/out -- env FSSTRESS=$FSSTRESS sh $PWD/fs-probe/send/${{ inputs.patch }}-guest.sh $PWD/fsp/in $PWD/out $x < /dev/null || echo "vng exit $?"
          done
          ls -l out; cat out/*.txt | tee -a $GITHUB_STEP_SUMMARY
          test -s out/base.txt && test -s out/new.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mainline-out, path: out, retention-days: 14 }

  fsck:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mainline-out, path: out }
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          run: |
            for g in out/*.img.gz; do
              [ -e $g ] || continue
              gunzip -f $g; i=${g%.gz}
              echo "== $i"
              md=$(mdconfig -a -t vnode -f $i)
              fsck_ffs -n -f /dev/$md > f.txt 2>&1; echo "fsck exit $?"
              grep -v '^\*\*' f.txt | head -8
              mdconfig -d -u $md
            done
