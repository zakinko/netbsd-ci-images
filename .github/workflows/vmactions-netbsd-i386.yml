name: vmactions 向け NetBSD イメージ

# vmactions には NetBSD/i386 のイメージが一つも無い。action にも builder にも
# i386 の conf が無く、release の asset にも無い (2026-09-23 に確認)。
#
# ここでは上流に足す conf をそのまま使って、anyvm-org/netbsd-builder の
# build.py で焼けるかを測る。焼けたという実績を添えて上流へ出すのが狙いで、
# このリポジトリで image を配るためのものではない。
#
# 上流の build.yml は `python3 build.py conf/netbsd-<os>.conf` 一行で、
# cf-tunnel の step は人が VNC を覗くためだけのもの (build.py はそれを
# 参照しない) なので、ここでは省いている。

on:
  # dispatch だけにしてある。conf を一本足すたびに既定の十版が走るのは無駄で、
  # しかも push と dispatch が同時に発火して、concurrency が互いを殺していた
  # (run 35766036570 と 35766036761 が相打ちになり、走っていた 10.1 まで
  # 巻き添えで cancelled になった)。
  workflow_dispatch:
    inputs:
      confs:
        description: 'JSON の配列で conf の名前を指定する。空なら i386 の十版'
        type: string
        default: ''

# 版の組ごとに別の run を投げるので、後から投げたものが前のものを殺しては
# 困る。待たせるのも困る (別の版なので競合しない) ので、run ごとに分ける。
concurrency:
  group: vmactions-netbsd-image-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.conf }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        conf: ${{ fromJSON(inputs.confs != '' && inputs.confs || '["netbsd-11.0-i386","netbsd-10.2-i386","netbsd-10.1-i386","netbsd-10.0-i386","netbsd-9.5-i386","netbsd-9.4-i386","netbsd-9.3-i386","netbsd-9.2-i386","netbsd-9.1-i386","netbsd-9.0-i386"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: KVM が在るか
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          # i386 の guest が KVM に載るかを、当てずっぽうではなく二つに分けて
          # 見る。binary が kvm を知っているか、device が使えるか。走る速さ
          # そのものは下の build が示す。
          qemu-system-i386 -accel help
          qemu-system-i386 -accel help | grep -qx '  *kvm' ||
            qemu-system-i386 -accel help | grep -q kvm ||
            { echo "!! qemu-system-i386 が kvm を知らない"; exit 1; }
          test -w /dev/kvm || { echo "!! /dev/kvm に書けない"; exit 1; }
          echo "i386 の guest は KVM で走る"

      - name: builder を持ってくる
        uses: actions/checkout@v4
        with:
          repository: anyvm-org/netbsd-builder
          ref: v2.2.6
          path: builder

      - name: conf を置く
        run: |
          c=vmactions/netbsd-builder/conf/${{ matrix.conf }}.conf
          test -f "$c" || { echo "!! $c が無い"; exit 1; }
          cp "$c" builder/conf/
          echo "--- 置いた conf"
          cat "builder/conf/$(basename "$c")"

      - name: 焼く
        working-directory: builder
        run: python3 build.py conf/${{ matrix.conf }}.conf

      - name: 出来たもの
        if: always()
        run: ls -l builder/build/ 2>/dev/null || echo "build/ が無い"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.conf }}
          path: |
            builder/build/${{ matrix.conf }}.qcow2.zst*
            builder/build/${{ matrix.conf }}.qemu
            builder/build/${{ matrix.conf }}.profile.json
            builder/build/${{ matrix.conf }}-id_rsa.pub
            builder/build/${{ matrix.conf }}-host.id_rsa
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
