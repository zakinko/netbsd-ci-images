name: vmactions 向け NetBSD イメージ

# NetBSD/i386 10.0 が起動の途中で page fault する件を、runner の CPU と
# -cpu の指定で分ける。
on:
  workflow_dispatch:
    inputs:
      confs:
        type: string
        default: '[1,2,3,4,5,6]'

jobs:
  cpu:
    name: cpu ${{ matrix.n }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(inputs.confs) }}
    steps:
      - run: |
          sudo apt-get update -qq; sudo apt-get install -y -qq qemu-system-x86 zstd >/dev/null
          sudo chmod 666 /dev/kvm
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(amx|avx512f$|pku$|xsave)' | tr '\n' ' '; echo
          for v in 10.0 10.1; do
            curl -sfLO https://github.com/$GITHUB_REPOSITORY/releases/download/v9.9.9/netbsd-$v-i386.qcow2.zst
            zstd -dq netbsd-$v-i386.qcow2.zst
          done
          one() { # name ver cpu
            qemu-system-i386 -machine pc,accel=kvm -cpu "$3" -m 2048 -smp 2 -display none -serial none -monitor unix:m.sock,server,nowait \
              -snapshot -drive file=netbsd-$2-i386.qcow2,if=virtio -netdev user,id=n,hostfwd=tcp::2299-:22 -device e1000,netdev=n & p=$!
            r=NO; i=0
            while [ $i -lt 60 ]; do
              if timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2299; head -c 4 <&3' 2>/dev/null | grep -q SSH; then r=SSH; break; fi
              sleep 2; i=$((i+1)); done
            [ $r = NO ] && { sudo apt-get install -y -qq socat >/dev/null 2>&1; echo "screendump s-$1.ppm" | socat - UNIX-CONNECT:m.sock >/dev/null; sleep 1; }
            kill $p; wait $p 2>/dev/null; rm -f m.sock; echo "RESULT $1 $r"
          }
          one 10.0-host 10.0 host
          one 10.0-host-noamx 10.0 host,-amx-tile,-amx-int8,-amx-bf16
          one 10.0-host-noavx512 10.0 host,-amx-tile,-amx-int8,-amx-bf16,-avx512f
          one 10.0-host-noxsave 10.0 host,-xsave
          one 10.1-host 10.1 host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ matrix.n }}
          path: s-*.ppm
          if-no-files-found: ignore
          retention-days: 2
