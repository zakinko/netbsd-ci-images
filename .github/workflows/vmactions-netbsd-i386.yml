name: vmactions 向け NetBSD イメージ

# 焼けたイメージを、上流の action (vmactions/<os>-vm) から起動してみる。
# action と anyvm.py は上流の物で、conf を足し、イメージの取得先だけ
# この repo の仮 release に替える。
on:
  workflow_dispatch:
    inputs:
      confs:
        description: 'JSON の配列。{"run":"焼いた run","img":"freebsd-15.1-ppc64le","os":"freebsd","rel":"15.1","arch":"ppc64le"}'
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  use:
    name: ${{ matrix.c.img }} ${{ matrix.c.sync }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        c: ${{ fromJSON(inputs.confs) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.c.img }}
          run-id: ${{ matrix.c.run }}
          github-token: ${{ github.token }}
          path: art
      - run: grep -m1 'model name' /proc/cpuinfo; grep -om1 amx_tile /proc/cpuinfo || echo no-amx
      - name: 仮の release に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l art
          gh release view v9.9.9 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create v9.9.9 -R "$GITHUB_REPOSITORY" --prerelease --title 'vmactions の試験用 (仮)' --notes '試験が終わったら消す' || true
          if [ "${{ matrix.c.arch }}" = powerpc ]; then
            curl -fsSL -o art/openbios-ppc https://gitlab.com/qemu-project/qemu/-/raw/v11.1.0/pc-bios/openbios-ppc
          fi
          # alpha は release のカーネルで起動する (netbsd-builder の
          # files/fetch-alpha-kernel.sh が上流の release に置く物と同じ)。
          if [ "${{ matrix.c.arch }}" = alpha ]; then
            curl -fsSL https://ftp.netbsd.org/pub/NetBSD/NetBSD-${{ matrix.c.rel }}/alpha/binary/kernel/netbsd-GENERIC.gz |
              gunzip > art/netbsd-${{ matrix.c.rel }}-alpha-kernel
          fi
          # 同時に走る job が --clobber で上書きし合うと、消えている間に
          # 他の job が 404 を引く。無い物だけを上げる。
          have=$(gh release view v9.9.9 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for f in art/*; do
            printf '%s\n' "$have" | grep -qx "$(basename "$f")" ||
              gh release upload v9.9.9 -R "$GITHUB_REPOSITORY" "$f" || true
          done
          sleep 20
      - uses: actions/checkout@v4
        with:
          repository: vmactions/${{ matrix.c.os }}-vm
          path: act
      - uses: actions/checkout@v4
        with:
          path: .self
      - run: cp -r .self/.github/e2e .e2e
      - name: conf を足し、取得先を替える
        run: |
          cd act
          # action の機種一覧は fork の base-vm の物 (powerpc と alpha を知る)
          curl -fsSL -o index.js https://raw.githubusercontent.com/zakinko/base-vm/netbsd-powerpc-alpha/index.js
          git diff --stat
          case "${{ matrix.c.arch }}" in ppc64le) b=15.1-powerpc64 ;; *) b=11.1 ;; esac
          sed 's/^BUILDER_VERSION=.*/BUILDER_VERSION=9.9.9/' conf/$b.conf > conf/${{ matrix.c.rel }}-${{ matrix.c.arch }}.conf
          cat conf/${{ matrix.c.rel }}-${{ matrix.c.arch }}.conf
          python3 ../.e2e/patch.py index.js
          git diff | cat
          grep -q zakinko/anyvm index.js
      - uses: ./act
        with:
          release: ${{ matrix.c.rel }}
          arch: ${{ matrix.c.arch }}
          sync: ${{ matrix.c.sync }}
          debug: true
          usesh: true
          run: |
            uname -a
            uname -m; uname -p; uname -r
            pwd; test -f act/action.yml
            echo made-in-guest > from-guest.txt
            echo "E2E-OK in guest"
            df -h /
            sh -c 'cat /etc/release 2>/dev/null | head -1; freebsd-version 2>/dev/null; true'
      - run: grep -x made-in-guest from-guest.txt
