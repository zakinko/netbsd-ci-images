name: ffs-fbsd-trunk
on:
  push:
    branches: [ffs-fbsd-trunk]
concurrency:
  group: ffs-fbsd-trunk
  cancel-in-progress: true
env:
  REV: 70d98372668cd062baca23959e1dc587c370607a
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: actions/cache@v4
        with:
          path: tools
          key: netbsd-tools-amd64-${{ env.REV }}
      - name: build
        run: sh ffs-trunk/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: trunk
          path: out/
      - name: room after
        if: always()
        run: df -h .; du -sh obj dest tools rel 2>/dev/null || true
  netbsd:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trunk
          path: out
      - name: qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 netcat-openbsd
          sudo chmod 666 /dev/kvm
      - name: image
        run: |
          B=https://github.com/${{ github.repository }}/releases/download/images
          curl -fsSL -O $B/amd64-11.0.qcow2
          curl -fsSL -O $B/amd64-11.0.qemu
      - name: boot
        run: MEM=8192 KEEP=1 DIR=. sh runvm.sh amd64-11.0 2222
      - name: trunk stock, then trunk patched
        run: sh ffs-trunk/host.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: after
          path: |
            after.tar
            atf.tar
      - name: stop
        if: always()
        run: DIR=. sh stopvm.sh amd64-11.0 || true
      - name: console
        if: failure()
        run: tail -80 amd64-11.0.console.log || true
  freebsd:
    needs: netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: after
      - name: stage
        run: |
          rm -f ufs2-probe/back/*
          tar xf after.tar
          for n in plain eaonly; do xz -c $n.img > ufs2-probe/back/back-k$n.img.xz; done
          : > ufs2-probe/back/kplain.expect
          cp ufs2-probe/kern/eaonly.expect ufs2-probe/back/keaonly.expect
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: sh ufs2-probe/verify.sh
