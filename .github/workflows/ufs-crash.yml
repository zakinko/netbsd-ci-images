name: ufs の穴の 0 埋めと電源断の順序を数える

on:
  workflow_dispatch:
    inputs:
      images_run:
        description: 'src-*bsd の artifact を持つ fs-probe の run (空なら最新)'
        type: string
        default: ''
      omit:
        description: '当てない当て物の名前の頭 (対照実験)'
        type: string
        default: ''
      parts:
        description: '行う段 (snap order speed stress replay prefix から)'
        type: string
        default: 'snap order speed stress replay'
      seeds:
        description: 'stress で回す fsstress の種 (空白区切り)'
        type: string
        default: '1'
      fss_args:
        description: 'fsstress の -s 以外の引数'
        type: string
        default: '-n 4000 -p 4'
      trace:
        description: 'ufs の割り当てを trace_printk で記録する (診断用)'
        type: boolean
        default: false
  # 頻度の低い競合は一晩の数十回では出ないことがあるので、毎晩違う種で
  # 数を重ねる。条件は fsstress を 8 本並べ truncate を外したもので、
  # ufs_change_blocknr() と ufs-08 の取りこぼしを一番多く出した
  # (run 42495970457、2026-11-08)。
  schedule:
    - cron: '17 18 * * *'

concurrency:
  group: ufs-crash-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # 定期実行には入力が無い。src-*bsd の artifact がまだ残っている最新の
  # 成功した fs-probe の run を使い、種は run 番号から毎晩違う 8 個にする。
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images_run: ${{ steps.pick.outputs.images_run }}
      seeds: ${{ steps.pick.outputs.seeds }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES_RUN: ${{ inputs.images_run }}
          SEEDS: ${{ inputs.seeds }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          run=$IMAGES_RUN
          if [ -z "$run" ]; then
            for r in $(gh run list -R ${{ github.repository }} -w fs-probe.yml --status success -L 30 --json databaseId -q '.[].databaseId'); do
              n=$(gh api repos/${{ github.repository }}/actions/runs/$r/artifacts -q '[.artifacts[] | select(.expired == false) | select(.name == "src-netbsd" or .name == "src-freebsd")] | length')
              [ "$n" = 2 ] && { run=$r; break; }
            done
          fi
          [ -n "$run" ] || { echo "!! src-netbsd と src-freebsd を持つ fs-probe の run が無い"; exit 1; }
          seeds=$SEEDS
          if [ -z "$seeds" ]; then
            b=$((RUN_NUMBER * 8))
            seeds=$(seq $((b + 1)) $((b + 8)) | tr '\n' ' ')
          fi
          echo "images from run $run, seeds $seeds"
          echo "images_run=$run" >> $GITHUB_OUTPUT
          echo "seeds=$seeds" >> $GITHUB_OUTPUT

  order:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rhel-default, kernel: rhel, opts: '' }
          - { name: rhel-lazyzero, kernel: rhel, opts: lazyzero }
          - { name: ml-default, kernel: ml, opts: '' }
          - { name: ml-lazyzero, kernel: ml, opts: lazyzero }
    name: order (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: src-*bsd
          path: fsp/in
          merge-multiple: true
          run-id: ${{ needs.setup.outputs.images_run }}
          github-token: ${{ github.token }}
      - name: kernel-ml の rpm を host で落とす
        if: matrix.kernel == 'ml'
        run: |
          set -e
          # elrepo.org の DNS は落ちることがある (2026-09-27、runner からも
          # 手元からも NS が時間切れ)。同じ中身のミラーへ順に回す。
          got=
          for m in https://elrepo.org/linux https://mirrors.coreix.net/elrepo \
                   https://mirror.rackspace.com/elrepo https://mirrors.tuna.tsinghua.edu.cn/elrepo; do
            b=$m/kernel/el10/x86_64/RPMS
            v=$(curl -fsSL -m 30 $b/ | grep -oE 'kernel-ml-core-[0-9][^"<>]*\.rpm' | sed 's/kernel-ml-core-//; s/\.x86_64\.rpm//' | sort -V | tail -1) || continue
            [ -n "$v" ] || continue
            r=$(curl -fsSL -m 30 $m/elrepo/el10/x86_64/RPMS/ | grep -oE 'elrepo-release-[0-9][^"<>]*\.rpm' | sort -V | tail -1) || continue
            mkdir -p fsp/rpms
            curl -fsSL -o fsp/rpms/$r $m/elrepo/el10/x86_64/RPMS/$r || continue
            ok=1
            for p in kernel-ml kernel-ml-core kernel-ml-modules kernel-ml-modules-extra kernel-ml-devel; do
              curl -fsSL -o fsp/rpms/$p-$v.x86_64.rpm $b/$p-$v.x86_64.rpm || { ok=; break; }
            done
            [ -n "$ok" ] && { got=$m; break; }
            rm -rf fsp/rpms
          done
          [ -n "$got" ] || { echo "!! kernel-ml を取れる所が無い"; exit 1; }
          echo "kernel-ml $v from $got"
          ls -l fsp/rpms
      - uses: vmactions/almalinux-vm@v1
        with:
          release: "10"
          mem: 8192
          run: sh fs-probe/kernel.sh shstk
      - name: user shadow stack を切った再起動から戻るのを待つ
        run: |
          printf 'uname -r\n' > $RUNNER_TEMP/u.sh
          sleep 45
          for i in $(seq 60); do almalinux $RUNNER_TEMP/u.sh && break; sleep 5; done
      - shell: almalinux {0}
        timeout-minutes: 20
        run: sh fs-probe/kernel.sh ${{ matrix.kernel }}
      - name: 再起動から戻るのを待ち、走っている kernel を確かめる
        if: matrix.kernel == 'ml'
        run: |
          printf 'uname -r\n' > $RUNNER_TEMP/u.sh
          sleep 45
          for i in $(seq 60); do almalinux $RUNNER_TEMP/u.sh && break; sleep 5; done
          printf 'test "$(uname -r)" = "$(cat /var/tmp/want-kernel)"\n' > $RUNNER_TEMP/k.sh
          almalinux $RUNNER_TEMP/k.sh
      - shell: almalinux {0}
        timeout-minutes: 100
        run: FS_PATCH=1 FS_PATCH_OMIT='${{ inputs.omit }}' UFS_OPTS='${{ matrix.opts }}' UFS_PARTS='${{ inputs.parts || 'stress replay' }}' UFS_STRESS_SEEDS='${{ needs.setup.outputs.seeds }}' UFS_FSS_ARGS='${{ inputs.fss_args || '-n 3000 -p 8 -f truncate=0' }}' UFS_TRACE='${{ inputs.trace && '1' || '' }}' sh fs-probe/ufs-crash.sh fsp/in fsp/crash
      - run: cat fsp/crash/crash.txt >> $GITHUB_STEP_SUMMARY
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-${{ matrix.name }}
          path: fsp/crash
