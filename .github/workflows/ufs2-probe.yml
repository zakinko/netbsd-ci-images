name: ufs2-probe
on:
  push:
    branches: [ufs2-quota-probe]
concurrency:
  group: ufs2-probe
  cancel-in-progress: true
env:
  SNAP: 20260928204101Z
jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 netcat-openbsd
          sudo chmod 666 /dev/kvm
      - name: image
        run: |
          B=https://github.com/${{ github.repository }}/releases/download/images
          curl -fsSL -O $B/amd64-11.0.qcow2
          curl -fsSL -O $B/amd64-11.0.qemu
      - name: boot 11.0
        run: KEEP=1 DIR=. sh runvm.sh amd64-11.0 2222
      - name: -current stock, then ffs-metackhash-v2
        run: |
          set -x
          SSH=$(cat ./amd64-11.0.ssh)
          alive() { n=0; until $SSH true 2>/dev/null; do n=$((n+1)); [ $n -gt 90 ] && return 1; sleep 5; done; }
          reboot_in() {	# command to run first, in the same session
            $SSH "$1; (sleep 5; /sbin/shutdown -r now) >/dev/null 2>&1 &" || true
            sleep 40; alive
          }
          (cd ufs2-probe/ck && tar cf - .) | $SSH 'mkdir -p /root/p/ck && cd /root/p/ck && tar xf -'
          reboot_in "sh /root/p/ck/upgrade.sh $SNAP kernel"
          $SSH uname -a
          reboot_in "sh /root/p/ck/upgrade.sh $SNAP userland"
          $SSH uname -a
          $SSH sh /root/p/ck/ck.sh stock T5 | tee stock.txt
          $SSH sh /root/p/ck/atf.sh stock | tee stock-atf.txt
          # A GENERIC built from the same tree and toolchain without the
          # patch: tells a build difference from the patch.
          reboot_in "sh /root/p/ck/swapk.sh ctl"
          $SSH uname -a
          $SSH sh /root/p/ck/ck.sh ctl T5 | tee ctl.txt
          $SSH sh /root/p/ck/swap.sh | tee swap.txt
          reboot_in true
          $SSH uname -a
          $SSH sh /root/p/ck/ck.sh v2 T1 T2 T4 T5 | tee v2.txt
          $SSH sh /root/p/ck/atf.sh v2 | tee v2-atf.txt
          { echo '```'; cat stock.txt stock-atf.txt ctl.txt v2.txt v2-atf.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: after
          path: |
            after.tar
            stock*.txt
            v2*.txt
            ctl.txt
            swap.txt
            amd64-11.0.console.log
      - name: stop
        if: always()
        run: DIR=. sh stopvm.sh amd64-11.0 || true
      - name: console
        if: always()
        run: tail -80 amd64-11.0.console.log || true
