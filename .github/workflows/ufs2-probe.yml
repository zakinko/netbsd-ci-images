name: ufs2-probe
on:
  push:
    branches: [ufs2-quota-probe]
concurrency:
  group: ufs2-probe
  cancel-in-progress: true
jobs:
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            sh ufs2-probe/verify.sh
            sh ufs2-probe/repro.sh
      - uses: actions/upload-artifact@v4
        with:
          name: repro
          path: out/ufs2.img.xz
