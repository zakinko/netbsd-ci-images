name: ufs2-probe
on:
  push:
    branches: [ufs2-quota-probe]
concurrency:
  group: ufs2-probe
  cancel-in-progress: true
jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 netcat-openbsd
          sudo chmod 666 /dev/kvm
      - name: image
        run: |
          B=https://github.com/${{ github.repository }}/releases/download/images
          curl -fsSL -O $B/amd64-11.0.qcow2
          curl -fsSL -O $B/amd64-11.0.qemu
      - name: boot 11.0
        run: KEEP=1 DIR=. sh runvm.sh amd64-11.0 2222
      - name: -current, the 2ea fixes, then the cost of the hashes
        run: |
          set -x
          # The kernel and the two userland programs were built from this
          # snapshot's own source sets, so the userland installed here must
          # come from the same one.
          SNAP=20261027225842Z
          curl -fsI https://nycdn.netbsd.org/pub/NetBSD-daily/HEAD/$SNAP/amd64/binary/sets/tests.tar.xz | head -1
          echo "snapshot $SNAP" | tee snap.txt
          SSH=$(cat ./amd64-11.0.ssh)
          alive() { n=0; until $SSH true 2>/dev/null; do n=$((n+1)); [ $n -gt 90 ] && return 1; sleep 5; done; }
          reboot_in() {	# command to run first, in the same session
            # Not shutdown(8): its SIGTERM sweep panics -current's
            # DIAGNOSTIC kernel in pg_remove() (KASSERT pg_members
            # empty, from spec_close() in exit), and the VM then hangs.
            $SSH "$1; (sleep 5; sync; sync; /sbin/reboot -q) >/dev/null 2>&1 &" || true
            sleep 40; alive
          }
          (cd ufs2-probe/ck && tar cf - .) | $SSH 'mkdir -p /root/p/ck && cd /root/p/ck && tar xf -'
          # Each step must show the kernel it expects; stop if not, so a
          # failed upgrade cannot pass for a measurement.
          is() { v=$($SSH uname -v); echo "$v"; case $v in *"$1"*) ;; *) echo "expected $1"; exit 1;; esac; }
          reboot_in "sh /root/p/ck/upgrade.sh $SNAP kernel"
          is "11.99.9 (GENERIC) #0: Tue Oct 27 22:58:42 UTC 2026"
          reboot_in "sh /root/p/ck/upgrade.sh $SNAP userland"
          is "11.99.9 (GENERIC) #0: Tue Oct 27 22:58:42 UTC 2026"
          $SSH 'ls /usr/tests/fs/ffs/Atffile /usr/tests/sbin/fsck_ffs/Atffile /usr/tests/sbin/newfs/Atffile' || exit 1
          # One run with hf failed t_quotalimit:slimit_le_1_group; its grace
          # time is 1s.  Same cases, many times, both libraries.
          $SSH sh /root/p/ck/rep.sh 20 | tee rep.txt
          { echo '```'; cat snap.txt rep.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: after
          path: |
            after.tar
            ea-*.txt
            atf-*.txt
            swapu-*.txt
            swaprump-*.txt
            rep.txt
            snap.txt
            swap.txt
            amd64-11.0.console.log
      - name: stop
        if: always()
        run: DIR=. sh stopvm.sh amd64-11.0 || true
      - name: console
        if: always()
        run: tail -80 amd64-11.0.console.log || true
