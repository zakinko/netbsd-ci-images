name: ufs2-probe
on:
  push:
    branches: [ufs2-quota-probe]
concurrency:
  group: ufs2-probe
  cancel-in-progress: true
env:
  SNAP: 20260928204101Z
jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 netcat-openbsd
          sudo chmod 666 /dev/kvm
      - name: image
        run: |
          B=https://github.com/${{ github.repository }}/releases/download/images
          curl -fsSL -O $B/amd64-11.0.qcow2
          curl -fsSL -O $B/amd64-11.0.qemu
      - name: boot 11.0
        run: KEEP=1 DIR=. sh runvm.sh amd64-11.0 2222
      - name: -current stock, then ffs-metackhash-v2
        run: |
          set -x
          SSH=$(cat ./amd64-11.0.ssh)
          alive() { n=0; until $SSH true 2>/dev/null; do n=$((n+1)); [ $n -gt 90 ] && return 1; sleep 5; done; }
          reboot_in() {	# command to run first, in the same session
            $SSH "$1; (sleep 5; /sbin/shutdown -r now) >/dev/null 2>&1 &" || true
            sleep 40; alive
          }
          (cd ufs2-probe/ck && tar cf - .) | $SSH 'mkdir -p /root/p/ck && cd /root/p/ck && tar xf -'
          reboot_in "sh /root/p/ck/upgrade.sh $SNAP kernel"
          $SSH uname -a
          reboot_in "sh /root/p/ck/upgrade.sh $SNAP userland"
          $SSH uname -a
          $SSH sh /root/p/ck/ck.sh stock T1 T2 T4 T5 | tee stock.txt
          $SSH sh /root/p/ck/atf.sh stock | tee stock-atf.txt
          $SSH sh /root/p/ck/swap.sh | tee swap.txt
          # T3 under the stock kernel hung for three hours once; give it
          # five minutes, and if it hangs, show where and reset the VM.
          if timeout 300 $SSH sh /root/p/ck/ck.sh stock T3 > stock-t3.txt 2>&1; then
            cat stock-t3.txt
            reboot_in true
          else
            echo "stock T3: no answer in 300 s"; cat stock-t3.txt
            timeout 60 $SSH 'ps -axo pid,ppid,stat,wchan,command | grep -vE "grep|sshd" | grep -E "mount|vnd|fsck|sync"; dmesg | tail -20' | tee stock-t3-hang.txt || echo "second ssh did not answer either" | tee -a stock-t3-hang.txt
            echo system_reset | nc -N -U amd64-11.0.mon || echo system_reset | nc -U -q1 amd64-11.0.mon
            sleep 40; alive
          fi
          $SSH uname -a
          $SSH sh /root/p/ck/ck.sh v2 T1 T2 T4 T5 | tee v2.txt
          timeout 300 $SSH sh /root/p/ck/ck.sh v2 T3 | tee v2-t3.txt || echo "v2 T3: no answer in 300 s" | tee -a v2-t3.txt
          $SSH true || { echo system_reset | nc -N -U amd64-11.0.mon; sleep 40; alive; }
          $SSH sh /root/p/ck/atf.sh v2 | tee v2-atf.txt
          $SSH 'cd /root/p/ck/v2 && tar cf - e1.img c-sb.img c-cg.img c-ino.img $(ls w.img 2>/dev/null)' > after.tar
          { echo '```'; cat stock.txt stock-atf.txt stock-t3*.txt v2.txt v2-t3.txt v2-atf.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: after
          path: |
            after.tar
            stock*.txt
            v2*.txt
            swap.txt
            amd64-11.0.console.log
      - name: stop
        if: always()
        run: DIR=. sh stopvm.sh amd64-11.0 || true
      - name: console
        if: always()
        run: tail -80 amd64-11.0.console.log || true
  freebsd:
    needs: netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: after
      - name: stage
        run: |
          rm -rf ufs2-probe/back && mkdir -p ufs2-probe/back
          tar xf after.tar
          for n in e1 w c-sb c-cg c-ino; do [ -f $n.img ] && xz -c $n.img > ufs2-probe/back/back-$n.img.xz; done
          cp ufs2-probe/ck/eaonly.expect ufs2-probe/back/e1.expect
          cp ufs2-probe/ck/eaonly.expect ufs2-probe/back/w.expect
          for n in c-sb c-cg c-ino; do : > ufs2-probe/back/$n.expect; done
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: sh ufs2-probe/verify.sh
