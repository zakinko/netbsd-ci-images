name: ufs2-probe
on:
  push:
    branches: [ufs2-quota-probe]
concurrency:
  group: ufs2-probe
  cancel-in-progress: true
env:
  SNAP: 20260928204101Z
jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 netcat-openbsd
          sudo chmod 666 /dev/kvm
      - name: image
        run: |
          B=https://github.com/${{ github.repository }}/releases/download/images
          curl -fsSL -O $B/amd64-11.0.qcow2
          curl -fsSL -O $B/amd64-11.0.qemu
      - name: boot 11.0
        run: KEEP=1 DIR=. sh runvm.sh amd64-11.0 2222
      - name: -current stock, then ffs-metackhash-v2
        run: |
          set -x
          SSH=$(cat ./amd64-11.0.ssh)
          reboot_wait() {
            $SSH '(sleep 2; /sbin/shutdown -r now) >/dev/null 2>&1 &' || true
            sleep 30
            n=0; until $SSH true 2>/dev/null; do n=$((n+1)); [ $n -gt 90 ] && exit 1; sleep 5; done
          }
          (cd ufs2-probe/ck && tar cf - .) | $SSH 'mkdir -p /root/p/ck && cd /root/p/ck && tar xf -'
          $SSH sh /root/p/ck/upgrade.sh $SNAP kernel
          reboot_wait
          $SSH uname -a
          $SSH sh /root/p/ck/upgrade.sh $SNAP userland
          reboot_wait
          $SSH uname -a
          $SSH sh /root/p/ck/ck.sh stock | tee stock.txt
          $SSH sh /root/p/ck/atf.sh stock | tee stock-atf.txt
          $SSH sh /root/p/ck/swap.sh
          reboot_wait
          $SSH uname -a
          $SSH sh /root/p/ck/ck.sh v2 | tee v2.txt
          $SSH sh /root/p/ck/atf.sh v2 | tee v2-atf.txt
          $SSH 'cd /root/p/ck/v2 && tar cf - e1.img w.img c-sb.img c-cg.img c-ino.img' > after.tar
          { echo '```'; cat stock.txt stock-atf.txt v2.txt v2-atf.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: after
          path: |
            after.tar
            stock*.txt
            v2*.txt
      - name: stop
        if: always()
        run: DIR=. sh stopvm.sh amd64-11.0 || true
      - name: console
        if: failure()
        run: tail -80 amd64-11.0.console.log || true
  freebsd:
    needs: netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: after
      - name: stage
        run: |
          rm -rf ufs2-probe/back && mkdir -p ufs2-probe/back
          tar xf after.tar
          for n in e1 w c-sb c-cg c-ino; do xz -c $n.img > ufs2-probe/back/back-$n.img.xz; done
          cp ufs2-probe/ck/eaonly.expect ufs2-probe/back/e1.expect
          cp ufs2-probe/ck/eaonly.expect ufs2-probe/back/w.expect
          for n in c-sb c-cg c-ino; do : > ufs2-probe/back/$n.expect; done
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: sh ufs2-probe/verify.sh
