name: verify-images

# 公開できない OS を、CI の上で組んで ssh まで通るかだけを確かめる。
#
# **何も公開しない。** イメージも媒体も release にも artifact にも上げない。
# runner の後始末と一緒に消える。残るのは「通ったかどうか」の一行だけ。
#
# 取得元はリポジトリのどこにも書いていない。二つの secret から渡す。
#
#	MEDIA_BASE    取得元の入口
#	MEDIA_PATHS   置き場と取得元ディレクトリの対応表 (media-paths.conf の中身)
#
# GitHub は secret の値をログで伏字にする。加えて fetch-media.sh が
# ::add-mask:: で入口・ホスト名・階層を登録し、curl の進捗表示を止め、
# 失敗メッセージからも伏せる。表示されるのはファイル名と大きさだけ。
#
# 手元でやると TCG で遅く、機械も塞がる。ここなら並行して回せる。ただし
# sparc や hppa のゲストは CI でも TCG で、速くなるのは x86 のゲストだけ。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '確かめるもの (例 "sunos-4.1.4-sparc")。空なら free 以外の全部'
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.q.outputs.targets }}
      count: ${{ steps.q.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        env:
          T: ${{ inputs.targets }}
        run: |
          set -e
          if [ -n "$T" ]; then
            list=$T
          else
            # 公開する側 (free) は build-os-images が組む。こちらは残り。
            list=$(for f in targets/*.conf; do
              grep -q '^LICENSE=free' "$f" && continue
              basename "$f" .conf
            done)
          fi
          printf '%s\n' $list > todo.txt
          cat todo.txt
          printf 'targets=%s\n' "$(jq -Rrn '[inputs] | tostring' < todo.txt)" >> $GITHUB_OUTPUT
          printf 'count=%s\n' "$(wc -l < todo.txt)" >> $GITHUB_OUTPUT

  verify:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: emulator と展開の道具を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-sparc \
            qemu-system-ppc qemu-system-arm qemu-system-misc qemu-utils \
            genisoimage lzip xz-utils bzip2

      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり (x86 のゲストのみ)" || echo "::warning::KVM 無し"

      - name: 取得元を用意する
        env:
          MEDIA_PATHS: ${{ secrets.MEDIA_PATHS }}
        run: |
          set -e
          if [ -z "$MEDIA_PATHS" ]; then
            echo "::error::secret MEDIA_PATHS が要る (media-paths.conf.example を見よ)"
            exit 1
          fi
          # 対応表を書き出す。中身は secret なのでログには出さない。
          umask 077
          printf '%s\n' "$MEDIA_PATHS" > media-paths.conf
          echo "対応表 $(grep -c '^[^#]' media-paths.conf) 行"

      - name: 組んで ssh まで通るか
        env:
          MEDIA_BASE: ${{ secrets.MEDIA_BASE }}
        run: |
          set -e
          if [ -z "$MEDIA_BASE" ]; then
            echo "::error::secret MEDIA_BASE が要る"
            exit 1
          fi
          sh build.sh ${{ matrix.target }}

      - name: 結果を残す
        if: always()
        run: |
          T=${{ matrix.target }}
          if [ -s "out/$T.ssh" ]; then
            echo "- **$T**: ssh まで通った" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **$T**: 通らなかった" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 転けたらコンソールを出す
        if: failure()
        run: |
          # コンソールには取得元が出ない (荷物は TFTP か HTTP で 10.0.2.2 から)。
          tail -c 3000 out/${{ matrix.target }}.console.log 2>/dev/null | tr -d '\r' || true

      - name: 後始末
        if: always()
        run: |
          # 媒体も組んだものも残さない。artifact にも上げない。
          rm -rf out disk_images media-paths.conf
          echo "消した"
