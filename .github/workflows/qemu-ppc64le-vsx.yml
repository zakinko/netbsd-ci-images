name: ppc64le の VSX の件を両側から測る

# noble の qemu 8.2.2 が lxvx/stxvx で偽の VSX Unavailable を上げる件を、
# 送る報告に貼る再現手順そのもので測る。
#
# 上流の修正は
#   master      8bded2e73e80  target/ppc: Fix lxvx/stxvx facility check (2024-09-11)
#   stable-8.2  40a3cb921391  v8.2.8 で入った (v8.2.7 には反転した判定が残る)
# noble は 8.2.2 なのでどちらより前。
#
# 手元 (brew の 11.1.1、arm64 の Mac) では同じ命令行が導入器の促しまで届く
# ことを確かめてある。ここで測るのは 8.2.2 の側。

on:
  workflow_dispatch:

concurrency:
  group: qemu-ppc64le-vsx-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  stock:
    name: noble 同梱の qemu で撃つ
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 道具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-ppc
          qemu-system-ppc64 --version | head -1

      - name: 媒体
        run: |
          curl -sSL -o bootonly.iso \
            https://download.freebsd.org/releases/powerpc/powerpc64le/ISO-IMAGES/15.0/FreeBSD-15.0-RELEASE-powerpc-powerpc64le-bootonly.iso
          ls -l bootonly.iso

      - name: 撃つ
        run: |
          set +e
          timeout 600 qemu-system-ppc64 \
            -machine pseries,accel=tcg,usb=off,cap-cfpc=broken,cap-sbbc=broken,cap-ibs=broken,cap-ccf-assist=off \
            -cpu power9 -m 4096 -smp 1 -nographic \
            -drive file=bootonly.iso,format=raw,if=none,id=inst0,media=cdrom \
            -device virtio-scsi-pci,id=scsi0 \
            -device scsi-cd,bus=scsi0.0,drive=inst0,bootindex=0 \
            > boot.log 2>&1 < /dev/null
          echo "== 出力の要点"
          grep -E 'Open Firmware loader|FreeBSD 15|cpu0:|Console type|Program Exception|SRR0' boot.log | head -12
          echo
          if grep -q 'Program Exception' boot.log; then
            echo "== 8.2.2 で Program Exception を再現した (期待どおり)"
            grep -n -A12 'Program Exception' boot.log | head -20
            exit 0
          fi
          if grep -q 'Console type' boot.log; then
            echo "!! 8.2.2 でも導入器まで届いた。前提が崩れているので報告を書き直す"
            exit 1
          fi
          echo "!! どちらでもない。log の末尾:"
          tail -30 boot.log
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-log-stock-qemu
          path: boot.log
          retention-days: 7

  faulting:
    name: 落ちている命令を特定する
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-ppc binutils-powerpc64le-linux-gnu xz-utils
          qemu-system-ppc64 --version | head -1

      - name: 媒体と loader
        run: |
          curl -sSL -o bootonly.iso \
            https://download.freebsd.org/releases/powerpc/powerpc64le/ISO-IMAGES/15.0/FreeBSD-15.0-RELEASE-powerpc-powerpc64le-bootonly.iso
          curl -sSL -o base.txz \
            https://download.freebsd.org/releases/powerpc/powerpc64le/15.0-RELEASE/base.txz
          tar -xJf base.txz ./boot/loader
          file boot/loader

      - name: 例外を吐かせる
        run: |
          # -d int は例外のたびに番地を出す。SRR0 が二度目の例外で上書き
          # される前の、最初の VSX Unavailable の NIP が要る。
          set +e
          timeout 420 qemu-system-ppc64 \
            -machine pseries,accel=tcg,usb=off,cap-cfpc=broken,cap-sbbc=broken,cap-ibs=broken,cap-ccf-assist=off \
            -cpu power9 -m 4096 -smp 1 -nographic \
            -d int -D qemu-int.log \
            -drive file=bootonly.iso,format=raw,if=none,id=inst0,media=cdrom \
            -device virtio-scsi-pci,id=scsi0 \
            -device scsi-cd,bus=scsi0.0,drive=inst0,bootindex=0 \
            > boot.log 2>&1 < /dev/null
          echo "== qemu-int.log の大きさ: $(wc -c < qemu-int.log)"
          echo
          echo "== VSX unavailable (0xf40) の記録"
          grep -n -i -B2 -A6 'vsx\|0xf40\|excp: 0x00000f40' qemu-int.log | head -60
          echo
          # 0 を信じる前に、必ず当たるはずの pattern で 1 以上が出ることを
          # 確かめる。ここは一度それで外した: 書式を見ずに
          #     Raise exception at [0-9a-fx]+ => 0x[0-9a-f]+
          # と組んだが、qemu は "=> VSXU (94)" と名前で出すので一行も当たらず、
          # step はそこで落ちていた。件数が取れないまま「VSXU が最初の例外か」
          # を言えない状態で先へ進んでいた。
          echo "== Raise exception の書式を先に見る (組む前に目で見る)"
          grep -m3 -a 'Raise exception' qemu-int.log || echo "(一行も無い)"
          echo
          echo "== 当たることを確かめる"
          nraise=$(grep -c -a 'Raise exception' qemu-int.log || echo 0)
          echo "   Raise exception の総数: $nraise"
          if [ "$nraise" -eq 0 ]; then
            echo "!! 一行も当たらない。trace が取れていないか書式が違う。"
            echo "   ここから下の 0 は全部意味が無いので数えない。"
          else
            echo
            echo "== 例外の種類ごとの件数"
            # 名前でも 0x 番号でも拾えるように、=> の右側をそのまま取る。
            sed -n 's/.*Raise exception at [^ ]* => \([^ ]*\).*/\1/p' qemu-int.log |
              sort | uniq -c | sort -rn | head -20
            echo
            echo "== 最初の例外の直前 20 行 (種類を問わず)"
            n=$(grep -n -a -m1 'Raise exception' qemu-int.log | cut -d: -f1)
            [ -n "$n" ] && sed -n "$((n>20 ? n-20 : 1)),$((n+5))p" qemu-int.log
          fi

      - name: 番地を loader の逆アセンブルに当てる
        if: always()
        run: |
          # -d int が出す NIP を loader の section に当てて、命令そのものを見る。
          powerpc64le-linux-gnu-objdump -d boot/loader > loader.dis 2>&1 || \
            powerpc64le-linux-gnu-objdump -b elf32-powerpcle -m powerpc -D boot/loader > loader.dis 2>&1 || true
          wc -l loader.dis
          # ここも 0 を出す検査なので、先に「当たるはずの物が当たる」を見る。
          # objdump は上で || true で二段に落としてあるため、失敗すると
          # loader.dis が error の文字列になり、VSX の数は当然 0 になる。
          # その 0 は「VSX が無い」ではなく「逆アセンブルできていない」。
          echo "== 逆アセンブルが成立しているか (必ず在る命令で確かめる)"
          nsane=$(grep -cE '\b(mflr|stwu|blr|lwz)\b' loader.dis || echo 0)
          echo "   mflr/stwu/blr/lwz の行: $nsane"
          if [ "$nsane" -lt 100 ]; then
            echo "!! 逆アセンブルが成立していない。下の 0 は意味が無い。"
            head -5 loader.dis
            exit 1
          fi
          echo "== VSX の load/store を loader の中で数える (網羅的に)"
          grep -cE '\b(lxv|stxv|lxs|stxs|xx[a-z]+|xv[a-z]+|xs[a-z]+|mtvsr|mfvsr)' loader.dis || echo 0
          grep -nE '\b(lxv|stxv|lxs|stxs|xx[a-z]+|xv[a-z]+|xs[a-z]+|mtvsr|mfvsr)' loader.dis | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-int-log
          path: |
            qemu-int.log
            boot.log
            loader.dis
          retention-days: 7
