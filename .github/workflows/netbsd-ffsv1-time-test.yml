name: NetBSD の FFSv1 の日付の差分を 2040 年の VM で試す

# 建て終えた run の成果物を取ってきて試す。建てる方 (netbsd-ffsv1-time) も
# 同じ試験を続けて回すので、これは試験だけをやり直すときに使う。
on:
  workflow_dispatch:
    inputs:
      build_run: { description: 'netbsd-ffsv1-time の run', type: string, required: true }

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: netbsd-ffsv1-time, path: in, run-id: '${{ inputs.build_run }}', github-token: '${{ github.token }}' }
      - uses: ./.github/actions/netbsd-ffsv1-test
        with: { dir: in }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ffsv1-time-test, path: res, retention-days: 14 }
