name: build-openbsd-images

# OpenBSD を autoinstall で入れ、qcow2 に固めて release に置く。
#
# NetBSD 側 (build-images.yml) は anita が sysinst を操るが、OpenBSD には
# autoinstall(8) が最初からあるので、応答ファイルを HTTP に置くだけでよい。
# こちらから叩くのはブートローダの一行だけ。
#
# ここに OpenBSD が居るのは、i386 のイメージがどこにも無いため。vmactions も
# cross-platform-actions も amd64 と aarch64 と riscv64 しか作っていない。
# ILP32 で確かめたいものがある側からすると、それでは足りない。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '作るもの (例 "i386-7.9 amd64-7.9")。空なら i386 だけ'
        required: false
      publish:
        description: 'release に上げる'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.q.outputs.targets }}
    steps:
      - id: q
        env:
          T: ${{ inputs.targets }}
        run: |
          set -e
          [ -n "$T" ] || T="i386-7.9"
          printf 'targets=%s\n' "$(printf '%s\n' $T | jq -Rrn '[inputs] | tostring')" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: qemu を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd

      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し"

      - name: イメージを作る
        run: |
          set -e
          arch=${{ matrix.target }}; arch=${arch%-*}
          rel=${{ matrix.target }};  rel=${rel#*-}
          sh build-openbsd-image.sh "$arch" "$rel"

      - name: 起動して ssh まで通るか
        run: |
          set -e
          sh runvm.sh openbsd-${{ matrix.target }} 2222
          SSH=$(cat ./openbsd-${{ matrix.target }}.ssh)
          $SSH 'uname -a; df -h /'

      - name: 止める
        if: always()
        run: sh stopvm.sh openbsd-${{ matrix.target }} || true

      - name: 転けたらコンソールを出す
        if: failure()
        run: |
          tail -60 /tmp/obimg-*/console.log 2>/dev/null || true
          tail -20 /tmp/obimg-*/httpd.log 2>/dev/null || true

      - name: release に上げる
        if: success() && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view images > /dev/null 2>&1 || \
            gh release create images --title "images for CI" --notes "CI 用のイメージ"
          gh release upload images \
            openbsd-${{ matrix.target }}.qcow2 openbsd-${{ matrix.target }}.qemu --clobber
