name: AlmaLinux 10 から NTFS と UFS/FFS をどこまで使えるか

# RHEL 10 系のカーネルは CONFIG_NTFS3_FS も CONFIG_UFS_FS も立てていない
# (kernel-core-6.12.0-211.7.4.el10_2 の config で 2026-09-26 に確認)。
# 足せるのは EPEL の ntfs-3g と、カーネルソースから自分で建てる fs/ufs。
# その二つの出来を、本物の相手で測る。
#
#   1. NetBSD / FreeBSD / Windows が自分の newfs / format でイメージを作る
#   2. Alma 10 がそれを読み、書き足す
#   3. 書き足したものを、作った OS 自身の fsck_ffs / chkdsk にかける

on:
  workflow_dispatch:
    inputs:
      kernels:
        description: 'JSON の配列。ml は ELRepo の kernel-ml、rhel は Alma 10 のまま'
        type: string
        default: '["ml","rhel"]'

concurrency:
  group: fs-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mk-netbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          run: sh fs-probe/bsd-make.sh fsp/netbsd
      - uses: actions/upload-artifact@v4
        with: { name: src-netbsd, path: fsp/netbsd, compression-level: 1 }

  mk-freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          run: sh fs-probe/bsd-make.sh fsp/freebsd
      - uses: actions/upload-artifact@v4
        with: { name: src-freebsd, path: fsp/freebsd, compression-level: 1 }

  mk-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./fs-probe/win-make.ps1 fsp/windows
      - uses: actions/upload-artifact@v4
        with: { name: src-windows, path: fsp/windows, compression-level: 1 }

  alma:
    needs: [mk-netbsd, mk-freebsd, mk-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # ml は ELRepo の kernel-ml (kernel.org の最新 stable)、rhel は Alma 10 のまま
        kernel: ${{ fromJSON(inputs.kernels) }}
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/download-artifact@v4
        with: { pattern: src-*, path: fsp/in, merge-multiple: true }
      - run: ls -ls fsp/in
      - name: kernel-ml の rpm を host で落とす
        if: matrix.kernel == 'ml'
        run: |
          set -e
          # elrepo.org の DNS は落ちることがある (2026-09-27、runner からも
          # 手元からも NS が時間切れ)。同じ中身のミラーへ順に回す。
          got=
          for m in https://elrepo.org/linux https://mirrors.coreix.net/elrepo \
                   https://mirror.rackspace.com/elrepo https://mirrors.tuna.tsinghua.edu.cn/elrepo; do
            b=$m/kernel/el10/x86_64/RPMS
            v=$(curl -fsSL -m 30 $b/ | grep -oE 'kernel-ml-core-[0-9][^"<>]*\.rpm' | sed 's/kernel-ml-core-//; s/\.x86_64\.rpm//' | sort -V | tail -1) || continue
            [ -n "$v" ] || continue
            r=$(curl -fsSL -m 30 $m/elrepo/el10/x86_64/RPMS/ | grep -oE 'elrepo-release-[0-9][^"<>]*\.rpm' | sort -V | tail -1) || continue
            mkdir -p fsp/rpms
            curl -fsSL -o fsp/rpms/$r $m/elrepo/el10/x86_64/RPMS/$r || continue
            ok=1
            for p in kernel-ml kernel-ml-core kernel-ml-modules kernel-ml-modules-extra kernel-ml-devel; do
              curl -fsSL -o fsp/rpms/$p-$v.x86_64.rpm $b/$p-$v.x86_64.rpm || { ok=; break; }
            done
            [ -n "$ok" ] && { got=$m; break; }
            rm -rf fsp/rpms
          done
          [ -n "$got" ] || { echo "!! kernel-ml を取れる所が無い"; exit 1; }
          echo "kernel-ml $v from $got"
          ls -l fsp/rpms
      - uses: vmactions/almalinux-vm@v1
        with:
          release: "10"
          mem: 8192
          run: sh fs-probe/kernel.sh ${{ matrix.kernel }}
      - name: 再起動から戻るのを待ち、走っている kernel を確かめる
        run: |
          printf 'uname -r\n' > $RUNNER_TEMP/u.sh
          if [ ${{ matrix.kernel }} = ml ]; then sleep 45; fi
          for i in $(seq 60); do almalinux $RUNNER_TEMP/u.sh && break; sleep 5; done
      - shell: almalinux {0}
        run: |
          uname -r
          # 差し替えたつもりの kernel で本当に走っているか。違えば測らない。
          if [ ${{ matrix.kernel }} = ml ]; then
            test "$(uname -r)" = "$(cat /var/tmp/want-kernel)"
          fi
      - shell: almalinux {0}
        run: sh fs-probe/alma.sh fsp/in fsp/alma-${{ matrix.kernel }}
      - run: cat fsp/alma-${{ matrix.kernel }}/summary.txt >> $GITHUB_STEP_SUMMARY
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alma-${{ matrix.kernel }}
          path: fsp/alma-${{ matrix.kernel }}
          compression-level: 1

  bench:
    needs: [mk-netbsd, mk-freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(inputs.kernels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: src-*bsd, path: fsp/in, merge-multiple: true }
      - name: kernel-ml の rpm を host で落とす
        if: matrix.kernel == 'ml'
        run: |
          set -e
          b=https://elrepo.org/linux/kernel/el10/x86_64/RPMS
          v=$(curl -fsSL $b/ | grep -oE 'kernel-ml-core-[0-9][^"<>]*\.rpm' | sed 's/kernel-ml-core-//; s/\.x86_64\.rpm//' | sort -V | tail -1)
          echo "kernel-ml $v"
          mkdir -p fsp/rpms
          for p in kernel-ml kernel-ml-core kernel-ml-modules kernel-ml-modules-extra kernel-ml-devel; do
            curl -fsSL -o fsp/rpms/$p-$v.x86_64.rpm $b/$p-$v.x86_64.rpm
          done
          ls -l fsp/rpms
      - uses: vmactions/almalinux-vm@v1
        with:
          release: "10"
          mem: 8192
          run: sh fs-probe/kernel.sh ${{ matrix.kernel }}
      - name: 再起動から戻るのを待ち、走っている kernel を確かめる
        run: |
          printf 'uname -r\n' > $RUNNER_TEMP/u.sh
          if [ ${{ matrix.kernel }} = ml ]; then sleep 45; fi
          for i in $(seq 60); do almalinux $RUNNER_TEMP/u.sh && break; sleep 5; done
      - shell: almalinux {0}
        run: |
          uname -r
          # 差し替えたつもりの kernel で本当に走っているか。違えば測らない。
          if [ ${{ matrix.kernel }} = ml ]; then
            test "$(uname -r)" = "$(cat /var/tmp/want-kernel)"
          fi
      - shell: almalinux {0}
        run: sh fs-probe/bench.sh fsp/in fsp/bench-${{ matrix.kernel }}
      - run: cat fsp/bench-${{ matrix.kernel }}/bench.txt >> $GITHUB_STEP_SUMMARY
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.kernel }}
          path: fsp/bench-${{ matrix.kernel }}

  check-netbsd:
    needs: alma
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(inputs.kernels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alma-${{ matrix.kernel }}
          path: fsp/alma
      - uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          run: sh fs-probe/bsd-check.sh fsp/alma fsp/check-netbsd-${{ matrix.kernel }}
      - run: cat fsp/check-netbsd-${{ matrix.kernel }}/*.check >> $GITHUB_STEP_SUMMARY
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-netbsd-${{ matrix.kernel }}
          path: fsp/check-netbsd-${{ matrix.kernel }}

  check-freebsd:
    needs: alma
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(inputs.kernels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alma-${{ matrix.kernel }}
          path: fsp/alma
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          run: sh fs-probe/bsd-check.sh fsp/alma fsp/check-freebsd-${{ matrix.kernel }}
      - run: cat fsp/check-freebsd-${{ matrix.kernel }}/*.check >> $GITHUB_STEP_SUMMARY
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-freebsd-${{ matrix.kernel }}
          path: fsp/check-freebsd-${{ matrix.kernel }}

  check-windows:
    needs: alma
    if: always()
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(inputs.kernels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alma-${{ matrix.kernel }}
          path: fsp/alma
      - shell: pwsh
        run: ./fs-probe/win-check.ps1 fsp/alma fsp/check-windows-${{ matrix.kernel }}
      - shell: pwsh
        if: always()
        run: Get-Content fsp/check-windows-${{ matrix.kernel }}/*.check | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-windows-${{ matrix.kernel }}
          path: fsp/check-windows-${{ matrix.kernel }}
