# SunOS 4.1.4 / sparc — QEMU の SS-5
#
# 手元にある展開済みイメージから起こし、OpenSSH を据えて ssh で入れるように
# する。手で通した手順をそのまま書いてある。
#
# 専有 PROM は要らない。ss5.bin が添えられているが、QEMU 同梱の OpenBIOS で
# 起動することを確かめてある。おかげでこの一台は PROM の再配布の話と無関係
# に扱える。
#
# 癖が四つある。
#
#   1. root の shell は csh。2>&1 は通らない
#   2. IP が 10.0.3.180 で焼かれていて qemu の user networking と噛み合わ
#      ない。SunOS 4 に DHCP は無いので静的に振り直す
#   3. HTTP を引く道具が無い。ftp は FTP しか喋らないので、荷物は TFTP で
#      渡す (qemu の user networking が内蔵している)
#   4. root の home は /etc/passwd で / になっている。/root ではない。
#      sshd が authorized_keys を探すのはそちら
#
# gcc は入っておらず /bin/cc は K&R なので、OpenSSH は組めない。当時の
# バイナリ (openssh-5.4p1、OpenSSL は静的リンク済み) を持ち込む。

OS=sunos
VERSION=4.1.4
PORT=sparc

# 再配布の許諾が無い。公開しない。CI は license=free だけを見る。
LICENSE=proprietary

DRIVER=prebuilt
EMU=qemu-system-sparc

MEDIA=SunOS/qemu/sunos414.img.lz
IMGFMT=qcow2

QEMUARGS="-M SS-5 -m 64 -boot c -drive file=@IMG@,format=qcow2,if=scsi,bus=0,unit=0"
BOOT_WAIT=420
SLOW=0.01

# TFTP で渡す荷物。OpenSSL は openssh に静的リンクされているので要らない。
PAYLOAD="SunOS/openssh-5.4p1.tar.lz"
PAYLOAD_SETUP=targets/sunos-4.1.4-sparc.setup
# 置き場は .ssh まで書く。SunOS 4 の root の home は / なので、
# sshd が見るのは /.ssh のほう。/root にも置いておく。
KEY_PATHS="/.ssh /root/.ssh"
HOSTKEY=/usr/local/etc/ssh_host_rsa_key

STEPS="login:=>root
#=>ifconfig le0 10.0.2.15 netmask 255.255.255.0 up; route add default 10.0.2.2 1
#=>(echo binary; echo get payload.tar /tmp/p.tar; echo quit) | tftp 10.0.2.2
#=>cd /; tar xpf /tmp/p.tar; sh /setup.sh
SETUP_DONE=>"

CHECK=ssh
SSH=yes
# 5.x の sshd と今の ssh を噛み合わせる。どれも新しい相手には無害。
SSHOPTS="-o KexAlgorithms=+diffie-hellman-group1-sha1,diffie-hellman-group14-sha1 -o HostkeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc,3des-cbc -o MACs=+hmac-sha1"

NOTE="root はパスワード無し、shell は csh、home は /。荷物は TFTP で渡す"
