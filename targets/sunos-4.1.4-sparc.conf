# SunOS 4.1.4 / sparc — QEMU の SS-5
#
# 手元にある展開済みイメージから起こすだけの一台。手で通した手順をそのまま
# 書いてある。
#
# 専有 PROM は要らない。ss5.bin が添えられているが、QEMU 同梱の OpenBIOS で
# 起動することを確かめてある (媒体に添えられた instructions.txt にも
# "OpenBios.bin works better than ss5.bin" とある)。おかげでこの一台は
# PROM の再配布の話と無関係に扱える。

OS=sunos
VERSION=4.1.4
PORT=sparc

# 再配布の許諾が無い。公開しない。CI は license=free だけを見る。
LICENSE=proprietary

DRIVER=prebuilt
EMU=qemu-system-sparc

# MEDIA_DIR からの相対。手元に無ければ MEDIA_BASE から取る (fetch-media.sh)。
MEDIA=SunOS/qemu/sunos414.img.lz
IMGFMT=qcow2

# if=scsi を明示するのは、この機械の起動元が SCSI の 0 番だから。既定の
# ままだと OpenBIOS が拾わない。root は sd3a。
QEMUARGS="-M SS-5 -m 32 -boot c -drive file=@IMG@,format=qcow2,if=scsi,bus=0,unit=0"

# 起動してから触れるようになるまで。SS-5 の模型で 50 秒ほど。
BOOT_WAIT=120

# 上がった後にやること。
#
#   root にパスワードは無い (媒体の instructions.txt のとおり)
#   root の shell は csh。2>&1 は通らないので、複雑なことは sh -c で包む
#   IP が 10.0.3.180 で焼かれていて qemu の user networking と噛み合わない。
#   SunOS 4 に DHCP は無いので静的に振り直す
STEPS="login:=>root|#=>ifconfig le0 10.0.2.15 netmask 255.255.255.0 up|#=>route add default 10.0.2.2 1"

# 届いたかどうかの確かめ方。sshd は入っていないので、いまは telnetd で
# 見る。gcc が無く /bin/cc は K&R なので、OpenSSH を組むには先に compiler を
# 用意することになる。そこは未着手 (SUPPORT.md 参照)。
CHECK=tcp:23
SSH=no

NOTE="root はパスワード無し、shell は csh。ssh はまだ無い"
