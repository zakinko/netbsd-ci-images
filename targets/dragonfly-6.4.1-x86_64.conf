# DragonFly BSD 6.4.1 / x86_64 — 公式の USB イメージから
#
# 配布元が起動できる img を公開しており、再配布も許されている (BSD licence)。
# 公開してよい側。
#
# FreeBSD と同じく、VGA が在ると firmware も loader も画面側にしか出さない
# ので -nographic で起こす (CONSOLE=stdio)。ただし FreeBSD と違って、
# loader のメニューにコンソールを切り替える項目が無い。ESC で loader の
# 促し (OK) に落として set console="comconsole" を打つ。
#
# 起動すると live の状態で、root にパスワードは無い。網は上がっていない
# ので dhclient を叩く。NIC は qemu の既定 (e1000) で em0。
#
# 網の設定は rc.conf に残す。配布されたままの live には ifconfig_em0 が無く、
# 二度目以降の起動では網が上がらない。焼いた rc.local が起動のたびに鍵を
# 取りに来る仕掛けも、それでは働かない (No route to host を 60 回繰り返して
# 諦めていた)。
#
# sshd は host key が無いまま出荷されているので ssh-keygen -A が要る。
# ここは FreeBSD と同じ。

OS=dragonfly
VERSION=6.4.1
PORT=x86_64

LICENSE=free
DRIVER=prebuilt
EMU=qemu-system-x86_64

MEDIA=DragonFly/dfly-x86_64-6.4.1_REL.img.bz2
MEDIA_URL=https://mirror-master.dragonflybsd.org/iso-images/dfly-x86_64-6.4.1_REL.img.bz2
IMGFMT=raw

QEMUARGS="-m 2048 -smp 2 -drive file=@IMG@,format=raw"
CONSOLE=stdio
BOOT_WAIT=900
# loader が取りこぼす。0.02 では boot が bot になって止まった。
SLOW=0.08
SETTLE=1.5
SEED=yes
PERSIST=yes

# 段の区切りは改行。単引用符で括ってあるのは、loader に渡す " をそのまま
# 送るため。二重引用符の中に書くと \" が " に潰れる前に一段余計に食われ、
# loader は console=\"comconsole\" という文字列を受け取って
# "set: operation not permitted" と言う。
#
# boot を三度書いてあるのは、この loader が促しを出した直後の何文字かを落と
# すため。boot が bot に、b に、b o になって "unknown command" で止まった。
# 打鍵を 0.08 秒から 0.2 秒に伸ばしても直らない。しかも促しに落とすと自動起動
# の待ち時間も止まるので、一文字落とせばその機械は永久に上がってこない。
# \r 区切りで三度送っておけば、一度目が潰れても二度目が通る。一度 boot が
# 走った後の余りはカーネル側のコンソールに落ちるが、getty が開くときに流れる。
STEPS='Boot DragonFly \[kernel\]=>\e
OK =>set console="comconsole"
OK =>boot\rboot\rboot
login:=>root
# =>dhclient em0
# =>ssh-keygen -A; mkdir -p /root/.ssh
# =>fetch -o /root/.ssh/authorized_keys http://10.0.2.2:@SEEDPORT@/authorized_keys; chmod 600 /root/.ssh/authorized_keys
# =>echo PermitRootLogin prohibit-password >> /etc/ssh/sshd_config; /etc/rc.d/sshd onestart
# =>echo sshd=YES >> /etc/rc.conf; echo dhclient_flags=\"\" >> /etc/rc.conf
# =>echo ifconfig_em0=\"DHCP\" >> /etc/rc.conf
# =>fetch -o /etc/rc.local http://10.0.2.2:@SEEDPORT@/seed_key.sh; chmod 755 /etc/rc.local
# =>sync'

CHECK=ssh
SSH=yes

NOTE="ESC で loader の促しに落として console を切り替える"
