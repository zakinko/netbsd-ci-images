# FreeBSD 14.3 / amd64 — 公式の VM イメージから
#
# 配布元が VM イメージを公開しており、再配布も許されている (BSD licence)。
# 公開してよい側。
#
# 三つ躓きどころがある。どれもイメージではなく起こし方の話。
#
#   1. VGA が在ると firmware も loader も画面側にしか出さない。-serial に
#      socket を宛てても一文字も来ないし、-vga none にしても変わらない。
#      -nographic のときだけシリアルに出る (CONSOLE=stdio)
#   2. カーネルのコンソールは Video 固定で出荷されている。loader のメニューで
#      5 を押すと Cons が Dual (Serial primary) になり、そこで 1 を押すと
#      multi user で起動する。Enter は効かない (loader は CR を待っており、
#      LF では動かない) ので、番号を押す
#   3. sshd が有効になっていないので host key が一つも無い。有効にするだけ
#      では "No host key files found" で起動に失敗する。ssh-keygen -A が要る
#
# 鍵は焼かない。仕込みの途中で一度だけホストから取る。

OS=freebsd
VERSION=14.4
PORT=amd64

LICENSE=free
DRIVER=prebuilt
EMU=qemu-system-x86_64

MEDIA=FreeBSD/FreeBSD-14.4-RELEASE-amd64.qcow2.xz
MEDIA_URL=https://download.freebsd.org/releases/VM-IMAGES/14.4-RELEASE/amd64/Latest/FreeBSD-14.4-RELEASE-amd64.qcow2.xz
IMGFMT=qcow2

QEMUARGS="-m 2048 -smp 2 -drive file=@IMG@,format=qcow2"
CONSOLE=stdio
BOOT_WAIT=900
# 一文字ずつ送る。loader は続けて流し込むと取りこぼし、閉じ引用符を待った
# まま止まる。実際 set console="comconsole" の途中で落ちた。
SLOW=0.02
SEED=yes
# 仕込みをイメージに残す。配るものは、起こしただけで ssh に入れないと
# 使う側が毎回 loader を叩くことになる。
PERSIST=yes

STEPS="Autoboot in=>5
Cons: Dual=>1
login:=>root
root@freebsd:~ #=>sysrc sshd_enable=YES; echo console=\\\"comconsole\\\" >> /boot/loader.conf
root@freebsd:~ #=>ssh-keygen -A
root@freebsd:~ #=>mkdir -p /root/.ssh; fetch -o /root/.ssh/authorized_keys http://10.0.2.2:@SEEDPORT@/authorized_keys; chmod 600 /root/.ssh/authorized_keys
root@freebsd:~ #=>echo PermitRootLogin prohibit-password >> /etc/ssh/sshd_config; service sshd start
root@freebsd:~ #=>fetch -o /etc/rc.local http://10.0.2.2:@SEEDPORT@/seed_key.sh; chmod 755 /etc/rc.local
root@freebsd:~ #=>sync"

CHECK=ssh
SSH=yes

NOTE="loader のメニューで 5 (Cons: Dual) → 1 (Boot Multi user)"
