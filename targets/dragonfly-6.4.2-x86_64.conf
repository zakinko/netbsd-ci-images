# DragonFly BSD 6.4.2 / x86_64 — 公式の USB イメージから
#
# 配布元が起動できる img を公開しており、再配布も許されている (BSD licence)。
# 公開してよい側。
#
# FreeBSD と同じく、VGA が在ると firmware も loader も画面側にしか出さない
# ので -nographic で起こす (CONSOLE=stdio)。ただし FreeBSD と違って、
# loader のメニューにコンソールを切り替える項目が無い。ESC で loader の
# 促し (OK) に落として set console="comconsole" を打つ。
#
# 起動すると live の状態で、root にパスワードは無い。網は上がっていない
# ので dhclient を叩く。NIC は qemu の既定 (e1000) で em0。
#
# sshd は host key が無いまま出荷されているので ssh-keygen -A が要る。
# ここは FreeBSD と同じ。

OS=dragonfly
VERSION=6.4.2
PORT=x86_64

LICENSE=free
DRIVER=prebuilt
EMU=qemu-system-x86_64

MEDIA=DragonFly/dfly-x86_64-6.4.2_REL.img.bz2
MEDIA_URL=https://mirror-master.dragonflybsd.org/iso-images/dfly-x86_64-6.4.2_REL.img.bz2
IMGFMT=raw

QEMUARGS="-m 2048 -smp 2 -drive file=@IMG@,format=raw"
CONSOLE=stdio
BOOT_WAIT=900
SLOW=0.02
SEED=yes

STEPS="Boot DragonFly \\[kernel\\]=>\\e
OK =>set console=\\\"comconsole\\\"
OK =>boot
login:=>root
# =>dhclient em0
# =>ssh-keygen -A; mkdir -p /root/.ssh
# =>fetch -o /root/.ssh/authorized_keys http://10.0.2.2:@SEEDPORT@/authorized_keys; chmod 600 /root/.ssh/authorized_keys
# =>echo PermitRootLogin prohibit-password >> /etc/ssh/sshd_config; /etc/rc.d/sshd onestart"

CHECK=ssh
SSH=yes

NOTE="ESC で loader の促しに落として console を切り替える"
