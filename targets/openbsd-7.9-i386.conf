# OpenBSD 7.9 / i386
#
# 入れ方は build-openbsd-image.sh がすべて持っている。anita に相当するものは
# 要らない。OpenBSD には autoinstall(8) が最初からあり、応答ファイルを HTTP に
# 置けば質問には全部それが答える。こちらから叩くのはブートローダの boot> に
# シリアルを使わせる一行だけで、あの促しは画面側にしか出ないので QEMU の
# モニタから sendkey で打ち込む。
#
# ここに置いてあるのは、対象の一覧に載せるためと、他の OS と同じ呼び方
# (sh build.sh <名前>) で叩けるようにするため。

OS=openbsd
VERSION=7.9
PORT=i386

LICENSE=free
DRIVER=autoinstall
EMU=qemu-system-i386

CHECK=ssh
SSH=yes

NOTE="autoinstall(8) で入れる。詳しくは build-openbsd-image.sh"
