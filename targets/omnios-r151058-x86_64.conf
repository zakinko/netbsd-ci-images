# OmniOS CE r151058 / x86_64 — 配布元の cloud イメージから
#
# illumos (OpenSolaris の後継) の一つ。配布元が cloud 向けの qcow2 を出して
# おり、CDDL なので再配布も許される。公開してよい側。
#
# cloud 向けのイメージには、鍵を受け取る口が cloud-init しかない。NoCloud の
# 種 (ラベル CIDATA の CD に meta-data と user-data を置いたもの) を挿すと、
# 起動時にそこから authorized_keys を取る。build.sh が SEED_ISO=yes で焼く。
#
# コンソールは、cloud 向けなので既定でシリアルに出る見込み。x86 の常で VGA が
# 在ると画面側に行くため -nographic で起こす (CONSOLE=stdio)。

OS=omnios
VERSION=r151058
PORT=x86_64

LICENSE=free
DRIVER=prebuilt
EMU=qemu-system-x86_64

MEDIA=OmniOS/omnios-r151058.cloud.qcow2
MEDIA_URL=https://downloads.omnios.org/media/stable/omnios-r151058.cloud.qcow2
IMGFMT=qcow2

QEMUARGS="-m 2048 -smp 2 -drive file=@IMG@,format=qcow2 -drive file=@SEEDISO@,format=raw,media=cdrom,readonly=on"
CONSOLE=stdio
BOOT_WAIT=900
SEED_ISO=yes
PERSIST=yes

CHECK=ssh
SSH=yes

NOTE="cloud-init の種 (CIDATA) で鍵を渡す"
