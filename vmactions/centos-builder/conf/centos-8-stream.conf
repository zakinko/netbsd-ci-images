# CentOS 8-stream.  vmactions has no centos repo at all; AlmaLinux and Rocky cover
# RHEL compatibility, but CentOS Stream is the other side of RHEL (its
# upstream), which is a different thing to test against.
#
# This release is EOL and its repositories have moved to vault.centos.org.
# The cloud image still ships /etc/yum.repos.d pointing at mirrorlist.centos.org,
# which no longer answers at all (measured: no response, not even a 404), so
# dnf fails before it reaches a mirror.  conf/centos-vault-pkgs.sh rewrites the
# repo files to vault before installing anything.
VM_VHD_LINK="https://cloud.centos.org/centos/8-stream/x86_64/images/CentOS-Stream-GenericCloud-8-20230822.0.x86_64.qcow2"
VM_OS_NAME="centos"
VM_SSH_PORT=2222
VM_RELEASE=8-stream
VM_ROOT_PASSWORD=anyvm.org
VM_LOGIN_TAG="login:"
VM_SHUTDOWN_CMD="shutdown -h now"
VM_INSTALL_CMD="dnf install -y "
VM_RSYNC_PKG="rsync"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG nfs-utils"
VM_INSTALL_SCRIPT="conf/centos-vault-pkgs.sh"
VM_NIC=virtio
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1
VM_SYNC_METHODS="rsync,scp,nfs,tar"
