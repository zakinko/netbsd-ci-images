# CentOS 9-stream.  vmactions has no centos repo at all; AlmaLinux and Rocky cover
# RHEL compatibility, but CentOS Stream is the other side of RHEL (its
# upstream), which is a different thing to test against.
VM_VHD_LINK="https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2"
VM_OS_NAME="centos"
VM_SSH_PORT=2222
VM_RELEASE=9-stream
VM_ROOT_PASSWORD=anyvm.org
VM_LOGIN_TAG="login:"
VM_SHUTDOWN_CMD="shutdown -h now"
VM_INSTALL_CMD="dnf install -y "
VM_RSYNC_PKG="rsync"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG nfs-utils"
VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"
VM_NIC=virtio
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1
VM_SYNC_METHODS="rsync,scp,nfs,tar"
