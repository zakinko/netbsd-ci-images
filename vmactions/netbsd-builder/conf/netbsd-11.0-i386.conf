
VM_RELEASE=11.0

# NetBSD/i386.  Same install path as the amd64 conf of the same release:
# sysinst driven by the release's own answer file.
#
# Like the 11.0 amd64 conf, this takes the DVD rather than the install ISO,
# but for a different reason.  amd64 needs it because sysinst SELECTS the
# 32-bit compat set "base32", which the install ISO does not carry, and errors
# out mid-install.  i386 has no base32 at all, and its install ISO does get
# through set extraction -- but then sysinst stops on an informational screen,
#
#   The set "manhtml" is optional and not included on this distribution medium
#   ... [enter to continue]
#
# which no answer file has a line for, so the install sits there until the
# step times out (measured: the 9.x and 10.x i386 install ISOs do not show
# it).  The DVD carries manhtml, so the screen never appears and the shared
# answer file stays untouched.
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.0/images/NetBSD-11.0-i386-dvd.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="/usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

# The 9.x amd64 confs anchor on "NetBSD/amd64 (localhost) (constty)", which
# names the architecture; 10.x and later moved to this arch-agnostic form.
# Using it here keeps one spelling across all ten i386 confs.
VM_LOGIN_TAG=") (constty)"

VM_OPTS="conf/netbsd-10.0.opts.txt"

# qemu-system-i386 on an x86_64 host runs under KVM, the same as the amd64
# guests: qemu_accel() only forces TCG for riscv64/s390x/loongarch64 and for
# a foreign-arch aarch64/ppc64.  i386 falls through to the host-arch branch.
# The machine is the PC-class one the final else already builds, and build.py
# already knows the name (the hurd conf branches on arch == "i386" there).
VM_ARCH=i386

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
