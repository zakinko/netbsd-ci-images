# NetBSD/i386, from the same media tree and answer file as the amd64 conf of
# this release.  8.x is the oldest branch whose binary packages still exist
# (under archive.netbsd.org/pub/pkgsrc-archive, ~20871 for i386); 8.3 has none
# at all.  sshfs is already ruled out by the amd64 conf -- fuse-sshfs is not in
# the 8.x repository for either architecture.
#
# qemu-system-i386 runs under KVM on an x86_64 host; see the 9.x-11.0 i386
# confs for why build.py needs no change to drive it.


VM_ISO_LINK="https://archive.netbsd.org/pub/NetBSD-archive/NetBSD-8.0/images/NetBSD-8.0-i386.iso"
VM_OS_NAME="netbsd"
VM_OS_TYPE="NetBSD"
VM_SSH_PORT=2225


VM_RELEASE=8.0

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

VM_INSTALL_CMD="/usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG=""
VM_PRE_INSTALL_PKGS="tree"

VM_LOGIN_TAG=") (console)"

VM_OPTS="conf/netbsd-8.0.opts.txt"
VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"

VM_ARCH=i386
