
VM_RELEASE=10.1

# NetBSD/i386.  Same install path as the amd64 conf of the same release: the
# standard install ISO driven by sysinst, with the release's own answer file.
#
# i386 needs no DVD.  The amd64 conf for 11.0 takes the DVD because sysinst
# selects the 32-bit compat set "base32" by default and the install ISO does
# not carry it.  There is no base32 on i386 -- the whole system is 32-bit --
# so the install ISO has every set sysinst asks for.
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-10.1/images/NetBSD-10.1-i386.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="/usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

# The 9.x amd64 confs anchor on "NetBSD/amd64 (localhost) (constty)", which
# names the architecture; 10.x and later moved to this arch-agnostic form.
# Using it here keeps one spelling across all ten i386 confs.
VM_LOGIN_TAG=") (constty)"

VM_OPTS="conf/netbsd-10.0.opts.txt"

# qemu-system-i386 on an x86_64 host runs under KVM, the same as the amd64
# guests: qemu_accel() only forces TCG for riscv64/s390x/loongarch64 and for
# a foreign-arch aarch64/ppc64.  i386 falls through to the host-arch branch.
# The machine is the PC-class one the final else already builds, and build.py
# already knows the name (the hurd conf branches on arch == "i386" there).
VM_ARCH=i386

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
