# NetBSD 8.3/amd64, base only.
#
# The 8 branch has no live pkgsrc binary repository.  ftp.netbsd.org's
# packages/NetBSD/{amd64,i386} start at 9.0; archive.netbsd.org's
# pkgsrc-archive still carries 8.0/8.1/8.2 (frozen, last written 2023-12-16)
# but nothing for 8.3 -- pkgsrc stopped building for this branch a year before
# 8.3 shipped (8.2 2020-04-01, last 8.x packages 2023-12-16, 8.3 2024-12-01).
# There is no DVD image to fall back on either: -dvd images start at the 10
# branch, and a NetBSD install ISO carries base sets, not packages.
#
# So these images ship base only, the way build.py already allows: an empty
# VM_PRE_INSTALL_PKGS skips the install step, and empty VM_RSYNC_PKG /
# VM_SSHFS_PKG skip the package verification boot ("skipped for base-only
# images such as riscv64 / powerpc64" in build.py).  Pinning the whole branch
# to a frozen 2023 archive would have made 8.0-8.2 work and left 8.3 out, and
# would have left the images depending on a shelf nobody refreshes.
#
# scp and tar are in base, so sync still works; rsync, sshfs and nfs are not
# offered because nothing installs them here.
# archive.netbsd.org answers a bare fetch with "HTTP 402 Payment Required"
# (its anti-bot gate); the ?key=NetBSD the 9.x confs carry is what gets
# through.  The 8.x confs in this repo predate that gate, which is the most
# likely reason they were dropped from all.release.conf -- they would have
# started failing at download with no change on their side.
VM_ISO_LINK="https://archive.netbsd.org/pub/NetBSD-archive/NetBSD-8.3/images/NetBSD-8.3-amd64.iso?key=NetBSD"
VM_OS_NAME="netbsd"
VM_OS_TYPE="NetBSD_64"
VM_SSH_PORT=2225

VM_RELEASE=8.3

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

# Base only -- see above.  build.py skips the install and the package
# verification when these are empty.
VM_PRE_INSTALL_PKGS=""
VM_RSYNC_PKG=""
VM_SSHFS_PKG=""
VM_SYNC_METHODS="scp,tar"

# 8.x's getty banner is "NetBSD/<arch> (localhost) (console)"; anchoring on the
# tail keeps one spelling for both architectures.
VM_LOGIN_TAG=") (console)"

VM_OPTS="conf/netbsd-8.0.opts.txt"
