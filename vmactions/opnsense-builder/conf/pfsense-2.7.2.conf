# pfSense CE 2.7.2, amd64.  Probe conf -- not expected to complete yet.
#
# vmactions has no pfsense builder at all.  OPNsense is the closest thing
# already here, and it sidesteps the installer entirely by taking the "nano"
# image, which is PREINSTALLED and already boots on ttyu0.  pfSense CE has no
# equivalent: atxfiles.netgate.com carries only installers --
#
#   pfSense-CE-2.7.2-RELEASE-amd64.iso.gz
#   pfSense-CE-memstick-2.7.2-RELEASE-amd64.img.gz
#   pfSense-CE-memstick-serial-2.7.2-RELEASE-amd64.img.gz
#   pfSense-CE-memstick-ADI-2.7.2-RELEASE-amd64.img.gz
#
# so it needs the installer driven, and then the post-install interface
# assignment, neither of which exists here yet.  The -serial variant is the
# right starting point: it boots with the console already on ttyu0, so the
# whole thing can be driven over the serial chardev the way OPNsense is.
#
# This conf exists to MEASURE what the installer asks and how far an
# unattended boot gets.  Until those answers are written down it will not
# produce an image.
VM_VHD_LINK="https://atxfiles.netgate.com/mirror/downloads/pfSense-CE-memstick-serial-2.7.2-RELEASE-amd64.img.gz"
VM_OS_NAME="pfsense"
VM_SSH_PORT=2222
VM_RELEASE=2.7.2
VM_ROOT_PASSWORD=pfsense
VM_LOGIN_TAG="(ttyu0)"
VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg install -y "
VM_RSYNC_PKG=
VM_SSHFS_PKG=
VM_PRE_INSTALL_PKGS=
VM_NIC=virtio
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1
VM_SYNC_METHODS="scp,tar"
