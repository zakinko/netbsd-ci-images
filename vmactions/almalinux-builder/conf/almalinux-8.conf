# AlmaLinux 8.  vmactions has 9 and 10 but not 8, though 8.10 is supported
# until 2029 and repo.almalinux.org still serves both the cloud image and the
# repositories.  Shaped on the 9 conf; only the image and release differ.
VM_VHD_LINK="https://repo.almalinux.org/almalinux/8/cloud/x86_64/images/AlmaLinux-8-GenericCloud-latest.x86_64.qcow2"
VM_OS_NAME="almalinux"
VM_SSH_PORT=2222
VM_RELEASE=8
VM_ROOT_PASSWORD=anyvm.org
VM_LOGIN_TAG="login:"
VM_SHUTDOWN_CMD="shutdown -h now"
VM_INSTALL_CMD="dnf install -y "
VM_RSYNC_PKG="rsync"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG nfs-utils"
VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"
VM_NIC=virtio
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1
VM_SYNC_METHODS="rsync,scp,nfs,tar"
