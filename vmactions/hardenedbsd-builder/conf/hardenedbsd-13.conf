# HardenedBSD 13-stable.  vmactions' action side only has 15, though the
# builder already has a conf for 14 and upstream publishes 13, 14 and 15.
# Shaped on the 14 conf; only the branch differs.  Like the others here it is
# a base-only image: VM_RSYNC_PKG and VM_SSHFS_PKG are empty, so build.py
# skips the package install and the verification boot.
VM_ISO_LINK="https://installers.hardenedbsd.org/pub/13-stable/amd64/amd64/installer/LATEST/bootonly.iso"
VM_OS_NAME="hardenedbsd"
VM_SSH_PORT=2222
VM_RELEASE=13
VM_LOGIN_TAG="(ttyu0)"
VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg install -y "
VM_RSYNC_PKG=
VM_SSHFS_PKG=
VM_PRE_INSTALL_PKGS=
VM_NIC=virtio
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1
VM_SYNC_METHODS="nfs,scp,tar"
