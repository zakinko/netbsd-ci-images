# OpenBSD 7.1 amd64.  vmactions' oldest OpenBSD is 7.2; upstream still
# publishes 7.1, just not on cdn.openbsd.org (which carries only the
# supported releases).  ftp.eu.openbsd.org keeps the full archive.
#
# Shaped on the 7.2 conf.  The only per-release values are the ISO, the
# OS type and the rsync package name -- 7.0 and 7.1 ship rsync-3.2.3p0,
# 7.2 ships 3.2.5pl0.
VM_RELEASE=7.1
VM_ISO_LINK="https://ftp.eu.openbsd.org/pub/OpenBSD/7.1/amd64/install71.iso"
VM_OS_NAME="openbsd"
VM_OS_TYPE="openbsd7.1"
VM_SSH_PORT=2224
VM_ROOT_PASSWORD=openbsd
VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg_add"
VM_RSYNC_PKG="rsync-3.2.3p0"
VM_SSHFS_PKG="sshfs-fuse"
VM_PRE_INSTALL_PKGS="tree"
VM_LOGIN_TAG="penBSD/amd64"
VM_OPTS="conf/openbsd-7.1.resp"
VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
