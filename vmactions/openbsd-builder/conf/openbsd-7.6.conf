# cdn.openbsd.org only carries the releases that are still supported -- as of
# 2026-09-23 that is 7.7, 7.8 and 7.9, and everything older answers 404.  The
# conf and the autoinstall response both pointed there, so this release could
# not be built any more: the ISO fetch failed, and even past that the installer
# would have fetched its sets from the same dead path.  ftp.eu.openbsd.org
# keeps the full archive (2.0 onwards), so point both at it.

VM_RELEASE=7.6

VM_ISO_LINK="https://ftp.eu.openbsd.org/pub/OpenBSD/7.6/amd64/install76.iso"
VM_OS_NAME="openbsd"
VM_OS_TYPE="openbsd7.2"
VM_SSH_PORT=2224


VM_ROOT_PASSWORD=openbsd

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg_add"

VM_RSYNC_PKG="rsync-3.3.0p2"
VM_SSHFS_PKG="sshfs-fuse"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_LOGIN_TAG="penBSD/amd64"


VM_OPTS="conf/openbsd-7.6.resp"


VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
