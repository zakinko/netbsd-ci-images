# GhostBSD 24.04.2.  vmactions carries only the newest release (26.1);
# download.ghostbsd.org keeps 18.10 onwards.  These are the 2024-and-later
# ones -- GhostBSD ships close to monthly and some pairs are two days apart
# (21.09.06 and 21.09.08), so taking every one of the 44 would be noise.
#
# Shaped on the 26.1 conf; only the ISO and VM_RELEASE differ.
VM_ISO_LINK="https://download.ghostbsd.org/releases/amd64/24.04.2/GhostBSD-24.04.2.iso"
VM_OS_NAME="ghostbsd"
VM_SSH_PORT=2228
VM_RELEASE=24.04.2
VM_DISK="ide"
VM_ROOT_PASSWORD="anyvm.org"
VM_USE_SSHROOT_BUILD_SSH=1
VM_LOGIN_TAG="logi"
VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg install -y "
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG GhostBSD-nfs"
VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
