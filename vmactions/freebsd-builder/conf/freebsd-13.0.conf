# FreeBSD 13.0 amd64.  Same shape as the 13.2 conf already in the tree;
# only the release differs.  vmactions carries 10.4, 11.4, 12.4 and 13.2-13.5
# but not the releases between them, though archive.freebsd.org publishes a
# prebuilt qcow2 for every one of them.
VM_VHD_LINK="https://archive.freebsd.org/old-releases/VM-IMAGES/13.0-RELEASE/amd64/Latest/FreeBSD-13.0-RELEASE-amd64.qcow2.xz"
VM_OS_NAME="freebsd"
VM_SSH_PORT=2222
VM_RELEASE=13.0
VM_LOGIN_TAG="64 (freebsd) (tty"
VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="IGNORE_OSVERSION=yes pkg  install  -y "
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs && kldload  fusefs"
VM_PRE_INSTALL_PKGS="tree rsync fusefs-sshfs"
VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
