# FreeBSD 11.0 amd64.  Same shape as the 11.4 conf already in the tree;
# only the release differs.  vmactions carries 10.4, 11.4, 12.4 and 13.2-13.5
# but not the releases between them, though archive.freebsd.org publishes a
# prebuilt qcow2 for every one of them.
VM_VHD_LINK="https://archive.freebsd.org/old-releases/VM-IMAGES/11.0-RELEASE/amd64/Latest/FreeBSD-11.0-RELEASE-amd64.qcow2.xz"
VM_OS_NAME="freebsd"
VM_SSH_PORT=2222
VM_RELEASE=11.0
VM_LOGIN_TAG="64 (freebsd) (tty"
VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg install -y "
# This branch is EOL, so pkg.FreeBSD.org no longer serves it; the same mirror
# the 11.4 conf uses.
VM_INSTALL_SCRIPT="conf/freebsd-legacy-pkg.sh"
VM_PKG_PATH="https://mirror.sg.gs/freebsd-pkg/FreeBSD:11:amd64/latest"
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
